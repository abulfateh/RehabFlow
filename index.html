      metalness: 0.05
    });

    const jointMat = new THREE.MeshStandardMaterial({
      color: linColor(THEME_3D.dark.jointHex),
      roughness: 0.30,
      metalness: 0.34
    });

    // Strict Shadowless Mesh Factory
    function makeMesh(geo, mat) {
      const m = new THREE.Mesh(geo, mat);
      m.castShadow = false;
      m.receiveShadow = false;
      return m;
    }

    // --- High-Res Vertex-Colored Sculpted Anatomical Parts ---
    const pelvisGeo = attachVertexColors(createHiResPelvisGeo(), baseColorLin);
    const torsoGeo = attachVertexColors(createHiResTorsoGeo(), baseColorLin);
    const thighRGeo = attachVertexColors(createHiResLimbGeo(0.070, 0.047, DIM.THIGH, 0.011, 0.35), baseColorLin);
    const thighLGeo = attachVertexColors(createHiResLimbGeo(0.070, 0.047, DIM.THIGH, 0.011, 0.35), baseColorLin);
    const shinRGeo = attachVertexColors(createHiResLimbGeo(0.047, 0.030, DIM.SHIN, 0.013, 0.30), baseColorLin);
    const shinLGeo = attachVertexColors(createHiResLimbGeo(0.047, 0.030, DIM.SHIN, 0.013, 0.30), baseColorLin);
    const uArmRGeo = attachVertexColors(createHiResLimbGeo(0.045, 0.034, DIM.UARM, 0.007, 0.40), baseColorLin);
    const uArmLGeo = attachVertexColors(createHiResLimbGeo(0.045, 0.034, DIM.UARM, 0.007, 0.40), baseColorLin);
    const fArmRGeo = attachVertexColors(createHiResLimbGeo(0.034, 0.023, DIM.FARM, 0.006, 0.34), baseColorLin);
    const fArmLGeo = attachVertexColors(createHiResLimbGeo(0.034, 0.023, DIM.FARM, 0.006, 0.34), baseColorLin);

    const pelvisGroup = new THREE.Group();
    pelvisGroup.add(makeMesh(pelvisGeo, bodyMat));
    root.add(pelvisGroup);

    const torsoGroup = new THREE.Group();
    torsoGroup.add(makeMesh(torsoGeo, bodyMat));
    // Smooth rounded neutral clavicle bar blending torso into shoulders
    const clavGeo = createHiResLimbGeo(0.056, 0.056, 0.26, 0.002, 0.5);
    clavGeo.translate(0, -0.13, 0);
    clavGeo.rotateZ(Math.PI / 2);
    const clavMesh = makeMesh(clavGeo, plainBodyMat);
    clavMesh.position.set(0, 0.355, 0);
    torsoGroup.add(clavMesh);
    root.add(torsoGroup);

    // --- Smooth Neck & Faceless Genderless Ovoid Head ---
    const neckMesh = makeMesh(createHiResLimbGeo(0.041, 0.036, DIM.NECK, 0.002, 0.5), plainBodyMat);
    root.add(neckMesh);

    const headGroup = new THREE.Group();
    headGroup.add(makeMesh(createSculptedHeadGeo(), plainBodyMat));
    root.add(headGroup);

    // --- Tapered Limbs ---
    const limbs = {
      thighR: makeMesh(thighRGeo, bodyMat),
      thighL: makeMesh(thighLGeo, bodyMat),
      shinR: makeMesh(shinRGeo, bodyMat),
      shinL: makeMesh(shinLGeo, bodyMat),
      uArmR: makeMesh(uArmRGeo, bodyMat),
      uArmL: makeMesh(uArmLGeo, bodyMat),
      fArmR: makeMesh(fArmRGeo, bodyMat),
      fArmL: makeMesh(fArmLGeo, bodyMat)
    };
    Object.values(limbs).forEach(m => root.add(m));

    // --- Sculpted Rounded Feet & Hands ---
    const footSoleGeo = createHiResLimbGeo(0.033, 0.024, DIM.FOOT, 0.005, 0.50);
    const handPalmGeo = createHiResLimbGeo(0.024, 0.018, DIM.HAND, 0.005, 0.45);
    function makeFoot() {
      const g = new THREE.Group();
      const sole = makeMesh(footSoleGeo, plainBodyMat);
      sole.scale.set(1.10, 1.0, 0.66);
      g.add(sole);
      const heel = makeMesh(new THREE.SphereGeometry(0.033, 18, 14), plainBodyMat);
      heel.position.set(0, -0.008, 0);
      g.add(heel);
      return g;
    }
    function makeHand() {
      const g = new THREE.Group();
      const palm = makeMesh(handPalmGeo, plainBodyMat);
      palm.scale.set(1.12, 1.0, 0.50);
      g.add(palm);
      return g;
    }
    const ext = {
      footR: makeFoot(),
      footL: makeFoot(),
      handR: makeHand(),
      handL: makeHand()
    };
    Object.values(ext).forEach(m => root.add(m));

    // --- Smooth Spherical Joints ---
    function makeJoint(r) {
      return makeMesh(new THREE.SphereGeometry(r, 22, 18), jointMat);
    }
    const joints = {
      hipR: makeJoint(0.055),
      hipL: makeJoint(0.055),
      kneeR: makeJoint(DIM.KNEE_R),
      kneeL: makeJoint(DIM.KNEE_R),
      ankleR: makeJoint(0.032),
      ankleL: makeJoint(0.032),
      shR: makeJoint(0.048),
      shL: makeJoint(0.048),
      elbR: makeJoint(0.035),
      elbL: makeJoint(0.035),
      wrR: makeJoint(0.024),
      wrL: makeJoint(0.024)
    };
    Object.values(joints).forEach(j => root.add(j));

    // --- Vertex-Color Registry & Precomputed Gaussian Surface Masks ---
    const staticVertexGeos = [uArmRGeo, uArmLGeo, fArmRGeo, fArmLGeo];
    const colorableParts = {
      pelvis: {
        geo: pelvisGeo,
        dirty: true,
        masks: {
          gluteBoth: buildPelvisMask(pelvisGeo, 'gluteBoth'),
          gMedBoth: buildPelvisMask(pelvisGeo, 'gMedBoth'),
          gMedR: buildPelvisMask(pelvisGeo, 'gMedR'),
          gMedL: buildPelvisMask(pelvisGeo, 'gMedL'),
          piriR: buildPelvisMask(pelvisGeo, 'piriR'),
          piriL: buildPelvisMask(pelvisGeo, 'piriL')
        }
      },
      torso: {
        geo: torsoGeo,
        dirty: true,
        masks: { abs: buildTorsoMask(torsoGeo) }
      },
      thighR: {
        geo: thighRGeo,
        dirty: true,
        masks: {
          quad: buildLimbMask(thighRGeo, DIM.THIGH, 'quad'),
          ham: buildLimbMask(thighRGeo, DIM.THIGH, 'ham'),
          add: buildLimbMask(thighRGeo, DIM.THIGH, 'addR'),
          latUpper: buildLimbMask(thighRGeo, DIM.THIGH, 'latUpperR'),
          piriUpper: buildLimbMask(thighRGeo, DIM.THIGH, 'piriUpperR')
        }
      },
      thighL: {
        geo: thighLGeo,
        dirty: true,
        masks: {
          quad: buildLimbMask(thighLGeo, DIM.THIGH, 'quad'),
          ham: buildLimbMask(thighLGeo, DIM.THIGH, 'ham'),
          add: buildLimbMask(thighLGeo, DIM.THIGH, 'addL'),
          latUpper: buildLimbMask(thighLGeo, DIM.THIGH, 'latUpperL'),
          piriUpper: buildLimbMask(thighLGeo, DIM.THIGH, 'piriUpperL')
        }
      },
      shinR: {
        geo: shinRGeo,
        dirty: true,
        masks: { calf: buildLimbMask(shinRGeo, DIM.SHIN, 'calf') }
      },
      shinL: {
        geo: shinLGeo,
        dirty: true,
        masks: { calf: buildLimbMask(shinLGeo, DIM.SHIN, 'calf') }
      }
    };

    function fillGeoBaseColor(geo, col) {
      const attr = geo.attributes.color;
      const arr = attr.array;
      const count = attr.count;
      for (let i = 0; i < count; i++) {
        const i3 = i * 3;
        arr[i3] = col.r;
        arr[i3 + 1] = col.g;
        arr[i3 + 2] = col.b;
      }
      attr.needsUpdate = true;
    }

    function setPalette(themeCfg) {
      baseColorLin = linColor(themeCfg.bodyHex);
      muscleColorLin = linColor(themeCfg.muscleHex);
      plainBodyMat.color.copy(baseColorLin);
      jointMat.color.copy(linColor(themeCfg.jointHex));
      staticVertexGeos.forEach(g => fillGeoBaseColor(g, baseColorLin));
      for (const key in colorableParts) colorableParts[key].dirty = true;
    }

    /**
     * Smoothly paints flush vertex colors proportionally to effort (0.2 -> 1.0)
     * with ZERO extra geometry or surface protrusion.
     */
    function updateFlushMuscles(activeList, effort) {
      const activeMap = {};
      for (let i = 0; i < activeList.length; i++) {
        activeMap[activeList[i].part] = activeList[i].mask;
      }
      const strength = 0.5 + 0.5 * clamp(effort != null ? effort : 0.2, 0, 1);
      const br = baseColorLin.r, bg = baseColorLin.g, bb = baseColorLin.b;
      const dr = muscleColorLin.r - br, dg = muscleColorLin.g - bg, db = muscleColorLin.b - bb;

      for (const partKey in colorableParts) {
        const part = colorableParts[partKey];
        const maskKey = activeMap[partKey];
        const colAttr = part.geo.attributes.color;
        const arr = colAttr.array;
        const count = colAttr.count;

        if (maskKey && part.masks[maskKey]) {
          const m = part.masks[maskKey];
          for (let i = 0; i < count; i++) {
            const t = Math.min(1, m[i] * 1.35) * strength;
            const i3 = i * 3;
            arr[i3] = br + dr * t;
            arr[i3 + 1] = bg + dg * t;
            arr[i3 + 2] = bb + db * t;
          }
          colAttr.needsUpdate = true;
          part.dirty = true;
        } else if (part.dirty) {
          for (let i = 0; i < count; i++) {
            const i3 = i * 3;
            arr[i3] = br;
            arr[i3 + 1] = bg;
            arr[i3 + 2] = bb;
          }
          colAttr.needsUpdate = true;
          part.dirty = false;
        }
      }
    }

    function applyPose(pose, activeMuscles, effort) {
      const up = new THREE.Vector3().subVectors(pose.shC, pose.pelC).normalize();
      const fwdHint = pose.fwd.clone().normalize();
      const left = new THREE.Vector3().crossVectors(up, fwdHint).normalize();
      const fwd = new THREE.Vector3().crossVectors(left, up).normalize();

      orientFrame(pelvisGroup, pose.pelC, left, up, fwd);
      orientFrame(torsoGroup, pose.pelC.clone().addScaledVector(up, 0.085), left, up, fwd);

      const neckBase = pose.shC.clone().addScaledVector(up, 0.035);
      const headDir = pose.headDir ? pose.headDir.clone().normalize() : up;
      const headPos = neckBase.clone().addScaledVector(headDir, DIM.NECK + 0.078);
      orientLimbFramed(neckMesh, neckBase, neckBase.clone().addScaledVector(headDir, DIM.NECK), fwd);
      const hFwd = new THREE.Vector3().crossVectors(left, headDir).normalize();
      orientFrame(headGroup, headPos, left, headDir, hFwd);

      orientLimbFramed(limbs.thighR, pose.hipR, pose.kneeR, pose.antThR || fwd);
      orientLimbFramed(limbs.thighL, pose.hipL, pose.kneeL, pose.antThL || fwd);
      orientLimbFramed(limbs.shinR, pose.kneeR, pose.ankleR, pose.antShR || pose.antThR || fwd);
      orientLimbFramed(limbs.shinL, pose.kneeL, pose.ankleL, pose.antShL || pose.antThL || fwd);
      orientLimbFramed(limbs.uArmR, pose.shR, pose.elbR, fwd);
      orientLimbFramed(limbs.uArmL, pose.shL, pose.elbL, fwd);
      orientLimbFramed(limbs.fArmR, pose.elbR, pose.wrR, fwd);
      orientLimbFramed(limbs.fArmL, pose.elbL, pose.wrL, fwd);

      orientLimbFramed(ext.footR, pose.ankleR, pose.toeR, up);
      orientLimbFramed(ext.footL, pose.ankleL, pose.toeL, up);
      orientLimbFramed(ext.handR, pose.wrR, pose.handEndR, fwd);
      orientLimbFramed(ext.handL, pose.wrL, pose.handEndL, fwd);

      joints.hipR.position.copy(pose.hipR);
      joints.hipL.position.copy(pose.hipL);
      joints.kneeR.position.copy(pose.kneeR);
      joints.kneeL.position.copy(pose.kneeL);
      joints.ankleR.position.copy(pose.ankleR);
      joints.ankleL.position.copy(pose.ankleL);
      joints.shR.position.copy(pose.shR);
      joints.shL.position.copy(pose.shL);
      joints.elbR.position.copy(pose.elbR);
      joints.elbL.position.copy(pose.elbL);
      joints.wrR.position.copy(pose.wrR);
      joints.wrL.position.copy(pose.wrL);

      updateFlushMuscles(activeMuscles || [], effort);
    }

    return { root, setPalette, applyPose };
  }

  /**
   * Dynamic 3D Elastic Resistance Band (closed smooth loop around both distal thighs)
   * sharing the EXACT SAME satin-matte golden-amber material as the Pilates ball!
   */
  function createDynamicBand(sharedRubberMat) {
    const SEG = 40;
    const RAD = 10;
    const positions = new Float32Array((SEG + 1) * (RAD + 1) * 3);
    const indices = [];
    for (let i = 0; i < SEG; i++) {
      for (let j = 0; j < RAD; j++) {
        const a = i * (RAD + 1) + j;
        const b = (i + 1) * (RAD + 1) + j;
        const c = (i + 1) * (RAD + 1) + (j + 1);
        const d = i * (RAD + 1) + (j + 1);
        indices.push(a, b, d, b, c, d);
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setIndex(indices);

    const mesh = new THREE.Mesh(geo, sharedRubberMat);
    mesh.castShadow = false;
    mesh.receiveShadow = false;
    mesh.visible = false;

    const u = new THREE.Vector3(), v = new THREE.Vector3(), w = new THREE.Vector3();
    const center = new THREE.Vector3(), pt = new THREE.Vector3(), normOut = new THREE.Vector3(), pos = new THREE.Vector3();

    function update(P1, P2, thighAxis, tension) {
      mesh.visible = true;
      center.addVectors(P1, P2).multiplyScalar(0.5);
      u.subVectors(P2, P1);
      const halfSpan = Math.max(0.06, u.length() * 0.5);
      u.normalize();

      w.copy(thighAxis).addScaledVector(u, -thighAxis.dot(u));
      if (w.lengthSq() < 1e-5) w.set(1, 0, 0);
      w.normalize();
      v.crossVectors(w, u).normalize();

      const rWrap = 0.062;
      const rx = halfSpan + rWrap;
      const ry = rWrap + 0.008;
      const bandWidth = lerp(0.036, 0.027, tension);
      const bandThick = 0.0085;

      const arr = geo.attributes.position.array;
      let idx = 0;
      for (let i = 0; i <= SEG; i++) {
        const theta = (i / SEG) * Math.PI * 2;
        const ct = Math.cos(theta), st = Math.sin(theta);
        const sx = Math.sign(ct) * Math.pow(Math.abs(ct), 0.78) * rx;
        const sy = Math.sign(st) * Math.pow(Math.abs(st), 0.78) * ry;
        pt.copy(center).addScaledVector(u, sx).addScaledVector(v, sy);
        normOut.set(0, 0, 0).addScaledVector(u, ct / rx).addScaledVector(v, st / ry).normalize();

        for (let j = 0; j <= RAD; j++) {
          const phi = (j / RAD) * Math.PI * 2;
          const cp = Math.cos(phi), sp = Math.sin(phi);
          pos.copy(pt).addScaledVector(normOut, cp * bandThick).addScaledVector(w, sp * bandWidth);
          arr[idx++] = pos.x;
          arr[idx++] = pos.y;
          arr[idx++] = pos.z;
        }
      }
      geo.attributes.position.needsUpdate = true;
      geo.computeVertexNormals();
    }

    return { mesh, update };
  }

  /* ==========================================================================
     4. ACCURATE 3D BIOMECHANICS FOR ALL 8 PHYSIOTHERAPY EXERCISES
     ========================================================================== */
  function computeExercisePose(exId, p, side, timeMs) {
    const s = side === 'L' ? -1 : 1;
    const breath = Math.sin((timeMs || 0) * 0.0026) * 0.003;
    const matY = DIM.MAT_Y;
    const pose = {};
    let activeMuscles = [];
    let bandData = null;
    let ballData = null;
    let heelRingPos = null;

    function supineBase(pelX, pelY, shX, shY) {
      pose.pelC = new THREE.Vector3(pelX, pelY, 0);
      pose.shC = new THREE.Vector3(shX, shY, 0);
      pose.fwd = new THREE.Vector3(0, 1, 0);
      pose.hipR = pose.pelC.clone().add(new THREE.Vector3(0, 0, DIM.HIP_W));
      pose.hipL = pose.pelC.clone().add(new THREE.Vector3(0, 0, -DIM.HIP_W));
      pose.shR = pose.shC.clone().add(new THREE.Vector3(0, 0, DIM.SH_W));
      pose.shL = pose.shC.clone().add(new THREE.Vector3(0, 0, -DIM.SH_W));
      pose.headDir = new THREE.Vector3(-1, 0.04, 0).normalize();
    }

    function supineRestArms() {
      pose.wrR = new THREE.Vector3(0.08, matY + 0.042, 0.245);
      pose.wrL = new THREE.Vector3(0.08, matY + 0.042, -0.245);
      pose.elbR = solveIK3D(pose.shR, pose.wrR, DIM.UARM, DIM.FARM, new THREE.Vector3(0, -0.4, 1));
      pose.elbL = solveIK3D(pose.shL, pose.wrL, DIM.UARM, DIM.FARM, new THREE.Vector3(0, -0.4, -1));
      pose.handEndR = pose.wrR.clone().add(new THREE.Vector3(DIM.HAND, -0.004, 0.01));
      pose.handEndL = pose.wrL.clone().add(new THREE.Vector3(DIM.HAND, -0.004, -0.01));
    }

    // --- EX 1: Straight Leg Raise (رفع الرجل المستقيمة) ---
    if (exId === 1) {
      supineBase(0.05, matY + 0.094, -0.43, matY + 0.094 + breath);
      supineRestArms();

      const wHip = s === 1 ? pose.hipR : pose.hipL;
      const bHip = s === 1 ? pose.hipL : pose.hipR;

      const bAnkle = new THREE.Vector3(0.58, matY + 0.046, -s * DIM.HIP_W * 1.12);
      const bKnee = solveIK3D(bHip, bAnkle, DIM.THIGH, DIM.SHIN, new THREE.Vector3(0, 1, 0));
      const bToe = bAnkle.clone().add(new THREE.Vector3(DIM.FOOT, -0.014, 0));

      const rad = (p.a || 0) * D2R;
      const legDir = new THREE.Vector3(Math.cos(rad), Math.sin(rad), 0);
      const wKnee = wHip.clone().addScaledVector(legDir, DIM.THIGH);
      const wAnkle = wKnee.clone().addScaledVector(legDir, DIM.SHIN);
      const wAnterior = new THREE.Vector3(-Math.sin(rad), Math.cos(rad), 0);
      const wToe = wAnkle.clone().addScaledVector(wAnterior, DIM.FOOT);

      if (s === 1) {
        pose.kneeR = wKnee; pose.ankleR = wAnkle; pose.toeR = wToe;
        pose.antThR = wAnterior; pose.antShR = wAnterior;
        pose.kneeL = bKnee; pose.ankleL = bAnkle; pose.toeL = bToe;
        pose.antThL = new THREE.Vector3(0, 1, 0); pose.antShL = new THREE.Vector3(0, 1, 0);
        activeMuscles = [{ part: 'thighR', mask: 'quad' }];
      } else {
        pose.kneeL = wKnee; pose.ankleL = wAnkle; pose.toeL = wToe;
        pose.antThL = wAnterior; pose.antShL = wAnterior;
        pose.kneeR = bKnee; pose.ankleR = bAnkle; pose.toeR = bToe;
        pose.antThR = new THREE.Vector3(0, 1, 0); pose.antShR = new THREE.Vector3(0, 1, 0);
        activeMuscles = [{ part: 'thighL', mask: 'quad' }];
      }
    }

    // --- EX 2: Glute Bridge (رفع الحوض / الجسر) ---
    else if (exId === 2) {
      const phi = (p.phi || 0) * D2R;
      const shX = -0.45, shY = matY + 0.094;
      const pelX = shX + Math.cos(phi) * DIM.TORSO;
      const pelY = shY + Math.sin(phi) * DIM.TORSO;
      supineBase(pelX, pelY, shX, shY);
      pose.fwd = new THREE.Vector3(-Math.sin(phi), Math.cos(phi), 0);
      supineRestArms();

      pose.ankleR = new THREE.Vector3(0.57, matY + 0.046, DIM.HIP_W * 1.15);
      pose.ankleL = new THREE.Vector3(0.57, matY + 0.046, -DIM.HIP_W * 1.15);
      pose.kneeR = solveIK3D(pose.hipR, pose.ankleR, DIM.THIGH, DIM.SHIN, new THREE.Vector3(0, 1, 0));
      pose.kneeL = solveIK3D(pose.hipL, pose.ankleL, DIM.THIGH, DIM.SHIN, new THREE.Vector3(0, 1, 0));
      pose.toeR = pose.ankleR.clone().add(new THREE.Vector3(DIM.FOOT, -0.014, 0));
      pose.toeL = pose.ankleL.clone().add(new THREE.Vector3(DIM.FOOT, -0.014, 0));
      pose.antThR = new THREE.Vector3(0, 1, 0);
      pose.antThL = new THREE.Vector3(0, 1, 0);
      pose.antShR = new THREE.Vector3(1, 0.3, 0);
      pose.antShL = new THREE.Vector3(1, 0.3, 0);

      activeMuscles = [
        { part: 'pelvis', mask: 'gluteBoth' },
        { part: 'thighR', mask: 'ham' },
        { part: 'thighL', mask: 'ham' }
      ];
    }

    // --- EX 3: Dead Bug / Tabletop Hold (ثبات اليدين والرجلين — وضع 6) ---
    else if (exId === 3) {
      const u = p.lift || 0;
      supineBase(0.05, matY + 0.094, -0.43, matY + 0.094 + breath);

      const armRad = lerp(0.06, Math.PI / 2, u);
      const armDir = new THREE.Vector3(Math.cos(armRad), Math.sin(armRad), 0);
      pose.elbR = pose.shR.clone().addScaledVector(armDir, DIM.UARM);
      pose.wrR = pose.elbR.clone().addScaledVector(armDir, DIM.FARM);
      pose.handEndR = pose.wrR.clone().addScaledVector(armDir, DIM.HAND);
      pose.elbL = pose.shL.clone().addScaledVector(armDir, DIM.UARM);
      pose.wrL = pose.elbL.clone().addScaledVector(armDir, DIM.FARM);
      pose.handEndL = pose.wrL.clone().addScaledVector(armDir, DIM.HAND);

      const thRad = lerp(38 * D2R, 90 * D2R, u) + breath * 1.4 * u;
      const shRad = lerp(-54 * D2R, 0, u);
      const thDir = new THREE.Vector3(Math.cos(thRad), Math.sin(thRad), 0);
      const shDir = new THREE.Vector3(Math.cos(shRad), Math.sin(shRad), 0);
      const ftDir = new THREE.Vector3(-Math.sin(shRad), Math.cos(shRad), 0);

      pose.kneeR = pose.hipR.clone().addScaledVector(thDir, DIM.THIGH);
      pose.ankleR = pose.kneeR.clone().addScaledVector(shDir, DIM.SHIN);
      pose.toeR = pose.ankleR.clone().addScaledVector(ftDir, DIM.FOOT);

      pose.kneeL = pose.hipL.clone().addScaledVector(thDir, DIM.THIGH);
      pose.ankleL = pose.kneeL.clone().addScaledVector(shDir, DIM.SHIN);
      pose.toeL = pose.ankleL.clone().addScaledVector(ftDir, DIM.FOOT);

      const antTh = new THREE.Vector3(-Math.sin(thRad), Math.cos(thRad), 0);
      pose.antThR = antTh; pose.antThL = antTh;
      pose.antShR = ftDir; pose.antShL = ftDir;

      activeMuscles = [{ part: 'torso', mask: 'abs' }];
    }

    // --- EX 4: Supine Banded Knee Abduction (فتح الركبتين على الظهر) ---
    else if (exId === 4) {
      const o = p.open || 0;
      supineBase(0.05, matY + 0.094, -0.43, matY + 0.094 + breath);
      supineRestArms();

      pose.ankleR = new THREE.Vector3(0.58, matY + 0.046, 0.082);
      pose.ankleL = new THREE.Vector3(0.58, matY + 0.046, -0.082);
      const poleOut = lerp(0.10, 0.96, o);
      const poleR = new THREE.Vector3(0, 1, poleOut).normalize();
      const poleL = new THREE.Vector3(0, 1, -poleOut).normalize();
      pose.kneeR = solveIK3D(pose.hipR, pose.ankleR, DIM.THIGH, DIM.SHIN, poleR);
      pose.kneeL = solveIK3D(pose.hipL, pose.ankleL, DIM.THIGH, DIM.SHIN, poleL);
      pose.toeR = pose.ankleR.clone().add(new THREE.Vector3(DIM.FOOT, -0.014, 0.02));
      pose.toeL = pose.ankleL.clone().add(new THREE.Vector3(DIM.FOOT, -0.014, -0.02));
      pose.antThR = poleR; pose.antThL = poleL;
      pose.antShR = poleR; pose.antShL = poleL;

      const bR = pose.hipR.clone().lerp(pose.kneeR, 0.78);
      const bL = pose.hipL.clone().lerp(pose.kneeL, 0.78);
      const thAxis = new THREE.Vector3()
        .subVectors(pose.kneeR, pose.hipR)
        .add(new THREE.Vector3().subVectors(pose.kneeL, pose.hipL))
        .normalize();
      bandData = { p1: bR, p2: bL, axis: thAxis, tension: o };

      activeMuscles = [
        { part: 'pelvis', mask: 'gMedBoth' },
        { part: 'thighR', mask: 'latUpper' },
        { part: 'thighL', mask: 'latUpper' }
      ];
    }

    // --- EX 5: Side-Lying Clamshell with Band (فتح الركبتين على الجنب) ---
    else if (exId === 5) {
      const o = p.open || 0;
      const headSign = s;
      const footSign = -s;
      pose.pelC = new THREE.Vector3(0.04 * footSign, matY + 0.195, -0.05);
      pose.shC = new THREE.Vector3(0.44 * headSign, matY + 0.195, -0.05);
      pose.fwd = new THREE.Vector3(0, 0, 1);
      pose.headDir = new THREE.Vector3(headSign, 0.04, 0).normalize();

      const topHip = pose.pelC.clone().add(new THREE.Vector3(0, DIM.HIP_W, 0));
      const botHip = pose.pelC.clone().add(new THREE.Vector3(0, -DIM.HIP_W, 0));
      const topSh = pose.shC.clone().add(new THREE.Vector3(0, DIM.SH_W, 0));
      const botSh = pose.shC.clone().add(new THREE.Vector3(0, -DIM.SH_W, 0));

      const botWr = new THREE.Vector3(0.64 * headSign, matY + 0.056, -0.03);
      const botElb = solveIK3D(botSh, botWr, DIM.UARM, DIM.FARM, new THREE.Vector3(0.2 * headSign, -0.25, 0.9));
      const botHand = botWr.clone().add(new THREE.Vector3(0.05 * headSign, 0.02, 0.04));

      const topWr = new THREE.Vector3(0.16 * headSign, matY + 0.045, 0.24);
      const topElb = solveIK3D(topSh, topWr, DIM.UARM, DIM.FARM, new THREE.Vector3(0.25 * headSign, 0.72, 0.6));
      const topHand = topWr.clone().add(new THREE.Vector3(0.04 * footSign, -0.005, 0.06));

      const botAnkle = new THREE.Vector3(0.50 * footSign, matY + 0.052, 0.08);
      const topAnkle = new THREE.Vector3(0.50 * footSign, matY + 0.114, 0.08);

      const botPole = new THREE.Vector3(0, -0.10, 1).normalize();
      const botKnee = solveIK3D(botHip, botAnkle, DIM.THIGH, DIM.SHIN, botPole);

      const openAngle = lerp(0.06, 1.04, o);
      const topPole = new THREE.Vector3(0, Math.sin(openAngle), Math.cos(openAngle)).normalize();
      const topKnee = solveIK3D(topHip, topAnkle, DIM.THIGH, DIM.SHIN, topPole);

      const botToe = botAnkle.clone().add(new THREE.Vector3(0.05 * footSign, -0.005, DIM.FOOT * 0.9));
      const topToe = topAnkle.clone().add(new THREE.Vector3(0.05 * footSign, 0.01, DIM.FOOT * 0.9));

      if (s === 1) {
        pose.hipR = topHip; pose.hipL = botHip;
        pose.shR = topSh; pose.shL = botSh;
        pose.elbR = topElb; pose.wrR = topWr; pose.handEndR = topHand;
        pose.elbL = botElb; pose.wrL = botWr; pose.handEndL = botHand;
        pose.kneeR = topKnee; pose.ankleR = topAnkle; pose.toeR = topToe;
        pose.kneeL = botKnee; pose.ankleL = botAnkle; pose.toeL = botToe;
        pose.antThR = topPole; pose.antShR = topPole;
        pose.antThL = botPole; pose.antShL = botPole;
        activeMuscles = [
          { part: 'pelvis', mask: 'gMedR' },
          { part: 'thighR', mask: 'latUpper' }
        ];
      } else {
        pose.hipL = topHip; pose.hipR = botHip;
        pose.shL = topSh; pose.shR = botSh;
        pose.elbL = topElb; pose.wrL = topWr; pose.handEndL = topHand;
        pose.elbR = botElb; pose.wrR = botWr; pose.handEndR = botHand;
        pose.kneeL = topKnee; pose.ankleL = topAnkle; pose.toeL = topToe;
        pose.kneeR = botKnee; pose.ankleR = botAnkle; pose.toeR = botToe;
        pose.antThL = topPole; pose.antShL = topPole;
        pose.antThR = botPole; pose.antShR = botPole;
        activeMuscles = [
          { part: 'pelvis', mask: 'gMedL' },
          { part: 'thighL', mask: 'latUpper' }
        ];
      }

      const bTop = topHip.clone().lerp(topKnee, 0.78);
      const bBot = botHip.clone().lerp(botKnee, 0.78);
      const thAxis = new THREE.Vector3()
        .subVectors(topKnee, topHip)
        .add(new THREE.Vector3().subVectors(botKnee, botHip))
        .normalize();
      bandData = { p1: bTop, p2: bBot, axis: thAxis, tension: o };
    }

    // --- EX 6: Pilates Ball Knee Squeeze (ضغط الكرة بين الركبتين) ---
    // Realistic moderate 14% compression (0.86 on Z axis, 1/sqrt(0.86) ≈ 1.078 on X/Y)
    // with exact mathematical knee-to-ball surface contact.
    else if (exId === 6) {
      const sq = clamp(p.sq || 0, 0, 1);
      supineBase(0.05, matY + 0.094, -0.43, matY + 0.094 + breath);
      supineRestArms();

      const scaleCompress = 1 - 0.14 * sq;                 // 1.00 -> 0.86 at peak
      const scaleExpand = 1 / Math.sqrt(scaleCompress);    // 1.00 -> ~1.0783 at peak
      const ballHalfZ = DIM.BALL_R * scaleCompress;        // 0.112 -> 0.09632
      const kneeZ = ballHalfZ + DIM.KNEE_R - 0.002;        // Crisp flush contact

      const footZ = lerp(0.152, 0.140, sq);
      pose.ankleR = new THREE.Vector3(0.58, matY + 0.046, footZ);
      pose.ankleL = new THREE.Vector3(0.58, matY + 0.046, -footZ);

      pose.kneeR = solveIKFixedZ(pose.hipR, pose.ankleR, DIM.THIGH, DIM.SHIN, kneeZ);
      pose.kneeL = solveIKFixedZ(pose.hipL, pose.ankleL, DIM.THIGH, DIM.SHIN, -kneeZ);

      pose.toeR = pose.ankleR.clone().add(new THREE.Vector3(DIM.FOOT, -0.014, 0));
      pose.toeL = pose.ankleL.clone().add(new THREE.Vector3(DIM.FOOT, -0.014, 0));

      pose.antThR = new THREE.Vector3(0, 1, 0);
      pose.antThL = new THREE.Vector3(0, 1, 0);
      pose.antShR = new THREE.Vector3(1, 0.25, 0);
      pose.antShL = new THREE.Vector3(1, 0.25, 0);

      ballData = {
        pos: new THREE.Vector3(pose.kneeR.x, pose.kneeR.y, 0),
        rx: DIM.BALL_R * scaleExpand,
        ry: DIM.BALL_R * scaleExpand,
        rz: DIM.BALL_R * scaleCompress
      };

      activeMuscles = [
        { part: 'thighR', mask: 'add' },
        { part: 'thighL', mask: 'add' }
      ];
    }

    // --- EX 7: Seated Figure-4 Piriformis Stretch (تمدد نص التربيعة) ---
    else if (exId === 7) {
      const lean = p.lean || 0;
      const leanRad = lerp(2, 42, lean) * D2R;
      const pelX = -0.14, pelY = 0.555;
      pose.pelC = new THREE.Vector3(pelX, pelY, 0);
      pose.shC = new THREE.Vector3(
        pelX + Math.sin(leanRad) * DIM.TORSO,
        pelY + Math.cos(leanRad) * DIM.TORSO,
        0
      );
      pose.fwd = new THREE.Vector3(Math.cos(leanRad), -Math.sin(leanRad), 0);
      pose.headDir = new THREE.Vector3(Math.sin(leanRad + 0.07), Math.cos(leanRad + 0.07), 0).normalize();

      pose.hipR = pose.pelC.clone().add(new THREE.Vector3(0, 0, DIM.HIP_W));
      pose.hipL = pose.pelC.clone().add(new THREE.Vector3(0, 0, -DIM.HIP_W));
      pose.shR = pose.shC.clone().add(new THREE.Vector3(0, 0, DIM.SH_W));
      pose.shL = pose.shC.clone().add(new THREE.Vector3(0, 0, -DIM.SH_W));

      const supHip = s === 1 ? pose.hipL : pose.hipR;
      const supAnkle = new THREE.Vector3(0.28, 0.054, -s * 0.13);
      const supPole = new THREE.Vector3(1, 0.16, 0).normalize();
      const supKnee = solveIK3D(supHip, supAnkle, DIM.THIGH, DIM.SHIN, supPole);
      const supToe = supAnkle.clone().add(new THREE.Vector3(DIM.FOOT, -0.014, 0));

      const crHip = s === 1 ? pose.hipR : pose.hipL;
      const crAnkle = supKnee.clone().add(new THREE.Vector3(-0.04, 0.078, s * 0.02));
      const crPole = new THREE.Vector3(0.55, 0.05, s * 0.92).normalize();
      const crKnee = solveIK3D(crHip, crAnkle, DIM.THIGH, DIM.SHIN, crPole);
      const crToe = crAnkle.clone().add(new THREE.Vector3(0.04, 0.045, -s * DIM.FOOT * 0.85));

      const wrWork = crKnee.clone().add(new THREE.Vector3(-0.01, 0.052, 0));
      const wrSup = crAnkle.clone().add(new THREE.Vector3(-0.01, 0.052, 0));

      if (s === 1) {
        pose.kneeR = crKnee; pose.ankleR = crAnkle; pose.toeR = crToe;
        pose.antThR = crPole; pose.antShR = crPole;
        pose.kneeL = supKnee; pose.ankleL = supAnkle; pose.toeL = supToe;
        pose.antThL = supPole; pose.antShL = supPole;
        pose.wrR = wrWork; pose.wrL = wrSup;
        pose.elbR = solveIK3D(pose.shR, pose.wrR, DIM.UARM, DIM.FARM, new THREE.Vector3(-0.3, -0.4, 0.8));
        pose.elbL = solveIK3D(pose.shL, pose.wrL, DIM.UARM, DIM.FARM, new THREE.Vector3(-0.3, -0.4, -0.8));
        pose.handEndR = pose.wrR.clone().add(new THREE.Vector3(0.06, -0.02, -0.04));
        pose.handEndL = pose.wrL.clone().add(new THREE.Vector3(0.06, -0.02, 0.04));
        activeMuscles = [
          { part: 'pelvis', mask: 'piriR' },
          { part: 'thighR', mask: 'piriUpper' }
        ];
      } else {
        pose.kneeL = crKnee; pose.ankleL = crAnkle; pose.toeL = crToe;
        pose.antThL = crPole; pose.antShL = crPole;
        pose.kneeR = supKnee; pose.ankleR = supAnkle; pose.toeR = supToe;
        pose.antThR = supPole; pose.antShR = supPole;
        pose.wrL = wrWork; pose.wrR = wrSup;
        pose.elbL = solveIK3D(pose.shL, pose.wrL, DIM.UARM, DIM.FARM, new THREE.Vector3(-0.3, -0.4, -0.8));
        pose.elbR = solveIK3D(pose.shR, pose.wrR, DIM.UARM, DIM.FARM, new THREE.Vector3(-0.3, -0.4, 0.8));
        pose.handEndL = pose.wrL.clone().add(new THREE.Vector3(0.06, -0.02, 0.04));
        pose.handEndR = pose.wrR.clone().add(new THREE.Vector3(0.06, -0.02, -0.04));
        activeMuscles = [
          { part: 'pelvis', mask: 'piriL' },
          { part: 'thighL', mask: 'piriUpper' }
        ];
      }
    }

    // --- EX 8: Standing Wall Calf Stretch (تمدد البطة على الجدار) ---
    else if (exId === 8) {
      const t = p.t || 0;
      const rearHeelX = -0.46;
      const rearAngle = lerp(66, 56, t) * D2R;
      const rearLen = DIM.THIGH + DIM.SHIN;

      const rearAnkle = new THREE.Vector3(rearHeelX, 0.052, s * 0.12);
      const rearHip = new THREE.Vector3(
        rearHeelX + Math.cos(rearAngle) * rearLen,
        0.052 + Math.sin(rearAngle) * rearLen,
        s * DIM.HIP_W
      );
      const rearKnee = rearHip.clone().lerp(rearAnkle, DIM.THIGH / rearLen);
      const rearToe = rearAnkle.clone().add(new THREE.Vector3(DIM.FOOT, -0.012, 0));

      pose.pelC = new THREE.Vector3(rearHip.x, rearHip.y, 0);
      const torsoLean = lerp(12, 24, t) * D2R;
      pose.shC = new THREE.Vector3(
        pose.pelC.x + Math.sin(torsoLean) * DIM.TORSO,
        pose.pelC.y + Math.cos(torsoLean) * DIM.TORSO,
        0
      );
      pose.fwd = new THREE.Vector3(Math.cos(torsoLean), -Math.sin(torsoLean), 0);
      pose.headDir = new THREE.Vector3(Math.sin(torsoLean - 0.08), Math.cos(torsoLean - 0.08), 0).normalize();

      pose.hipR = pose.pelC.clone().add(new THREE.Vector3(0, 0, DIM.HIP_W));
      pose.hipL = pose.pelC.clone().add(new THREE.Vector3(0, 0, -DIM.HIP_W));
      pose.shR = pose.shC.clone().add(new THREE.Vector3(0, 0, DIM.SH_W));
      pose.shL = pose.shC.clone().add(new THREE.Vector3(0, 0, -DIM.SH_W));

      const frontHip = s === 1 ? pose.hipL : pose.hipR;
      const frontAnkle = new THREE.Vector3(0.18, 0.052, -s * 0.12);
      const frontPole = new THREE.Vector3(1, 0.14, 0).normalize();
      const frontKnee = solveIK3D(frontHip, frontAnkle, DIM.THIGH, DIM.SHIN, frontPole);
      const frontToe = frontAnkle.clone().add(new THREE.Vector3(DIM.FOOT, -0.012, 0));

      const wallX = 0.66;
      const handY = lerp(1.24, 1.21, t);
      pose.wrR = new THREE.Vector3(wallX, handY, 0.18);
      pose.wrL = new THREE.Vector3(wallX, handY, -0.18);
      pose.elbR = solveIK3D(pose.shR, pose.wrR, DIM.UARM, DIM.FARM, new THREE.Vector3(-0.2, -0.85, 0.45));
      pose.elbL = solveIK3D(pose.shL, pose.wrL, DIM.UARM, DIM.FARM, new THREE.Vector3(-0.2, -0.85, -0.45));
      pose.handEndR = pose.wrR.clone().add(new THREE.Vector3(0.01, DIM.HAND, 0));
      pose.handEndL = pose.wrL.clone().add(new THREE.Vector3(0.01, DIM.HAND, 0));

      const rearAnt = new THREE.Vector3(1, 0, 0);
      if (s === 1) {
        pose.kneeR = rearKnee; pose.ankleR = rearAnkle; pose.toeR = rearToe;
        pose.antThR = rearAnt; pose.antShR = rearAnt;
        pose.kneeL = frontKnee; pose.ankleL = frontAnkle; pose.toeL = frontToe;
        pose.antThL = frontPole; pose.antShL = frontPole;
        activeMuscles = [{ part: 'shinR', mask: 'calf' }];
      } else {
        pose.kneeL = rearKnee; pose.ankleL = rearAnkle; pose.toeL = rearToe;
        pose.antThL = rearAnt; pose.antShL = rearAnt;
        pose.kneeR = frontKnee; pose.ankleR = frontAnkle; pose.toeR = frontToe;
        pose.antThR = frontPole; pose.antShR = frontPole;
        activeMuscles = [{ part: 'shinL', mask: 'calf' }];
      }
      heelRingPos = new THREE.Vector3(rearHeelX + 0.018, 0.004, s * 0.12);
    }

    return { pose, activeMuscles, bandData, ballData, heelRingPos };
  }

  /* ==========================================================================
     5. CAMERA PRESETS & SHADOWLESS 3D STUDIO INITIALIZATION
     ========================================================================== */
  function getCameraPreset(exId, side, preset) {
    const s = side === 'L' ? -1 : 1;
    let target = new THREE.Vector3(0.06, 0.28, 0);
    if (exId === 7) target.set(0.06, 0.56, 0);
    else if (exId === 8) target.set(0.06, 0.72, 0);
    else if (exId === 3) target.set(0.05, 0.36, 0);

    if (preset === 'side') {
      const dist = exId === 8 ? 2.45 : (exId === 7 ? 2.05 : 2.15);
      const th = (exId === 1 || exId === 7 || exId === 8) ? (s === 1 ? 0 : Math.PI) : 0;
      return { theta: th, phi: 1.32, r: dist, target };
    }
    if (preset === 'top') {
      const dist = exId === 8 ? 2.65 : 2.15;
      return { theta: 0.01, phi: 0.24, r: dist, target };
    }
    if (preset === 'front') {
      const dist = exId === 8 ? 2.4 : 2.05;
      return { theta: Math.PI * 0.42, phi: 1.12, r: dist, target };
    }

    switch (exId) {
      case 1: return { theta: s === 1 ? 0.34 : Math.PI - 0.34, phi: 1.16, r: 2.05, target };
      case 2: return { theta: 0.34, phi: 1.18, r: 2.05, target };
      case 3: return { theta: 0.36, phi: 1.14, r: 2.12, target };
      case 4: return { theta: 0.90, phi: 0.78, r: 1.92, target: new THREE.Vector3(0.18, 0.24, 0) };
      case 5: return { theta: s === 1 ? -0.26 : 0.26, phi: 1.05, r: 1.94, target: new THREE.Vector3(-0.04 * s, 0.24, 0.04) };
      case 6: return { theta: 0.88, phi: 0.80, r: 1.88, target: new THREE.Vector3(0.22, 0.25, 0) };
      case 7: return { theta: s === 1 ? 0.62 : Math.PI - 0.62, phi: 1.16, r: 1.98, target };
      case 8: return { theta: s === 1 ? 0.34 : Math.PI - 0.34, phi: 1.24, r: 2.38, target };
      default: return { theta: 0.34, phi: 1.15, r: 2.05, target };
    }
  }

  function initStudio() {
    const canvas = $('glCanvas');
    if (!window.THREE) {
      $('glFallback').hidden = false;
      return null;
    }

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    } catch (e) {
      $('glFallback').hidden = false;
      return null;
    }

    // Crisp HiDPI rendering + STRICTLY NO SHADOW MAPS
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.shadowMap.enabled = false;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.04;

    const scene = new THREE.Scene();
    scene.fog = null; // Flat solid background, zero fog, zero ground plane, zero grids
    const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 30);

    // --- Balanced Shadowless 3-Point + Hemisphere Studio Lighting ---
    const hemiLight = new THREE.HemisphereLight(0xE6F1F8, 0x222A33, 0.86);
    scene.add(hemiLight);

    const keyLight = new THREE.DirectionalLight(0xFFFDF8, 1.05);
    keyLight.position.set(2.4, 4.2, 2.8);
    keyLight.castShadow = false;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xB8D0E4, 0.46);
    fillLight.position.set(-2.6, 1.6, 2.2);
    fillLight.castShadow = false;
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0x9AD2EC, 0.62);
    rimLight.position.set(-2.2, 3.0, -2.8);
    rimLight.castShadow = false;
    scene.add(rimLight);

    // --- Shared Satin-Matte Golden-Amber Rubber Material (IDENTICAL for Resistance Band & Ball!) ---
    const sharedRubberMat = new THREE.MeshStandardMaterial({
      color: linColor(THEME_3D.dark.rubberHex),
      emissive: linColor(THEME_3D.dark.rubberEmissive),
      emissiveIntensity: 1.0,
      roughness: THEME_3D.dark.rubberRoughness,
      metalness: THEME_3D.dark.rubberMetalness
    });

    // --- Shadowless Exercise Props ---
    // 1. Minimalist Exercise Mat (Ex 1–6)
    const matGroup = new THREE.Group();
    function makeRoundedRectShape(w, h, r) {
      const sh = new THREE.Shape();
      const hw = w / 2, hh = h / 2;
      sh.moveTo(-hw + r, -hh);
      sh.lineTo(hw - r, -hh);
      sh.quadraticCurveTo(hw, -hh, hw, -hh + r);
      sh.lineTo(hw, hh - r);
      sh.quadraticCurveTo(hw, hh, hw - r, hh);
      sh.lineTo(-hw + r, hh);
      sh.quadraticCurveTo(-hw, hh, -hw, hh - r);
      sh.lineTo(-hw, -hh + r);
      sh.quadraticCurveTo(-hw, -hh, -hw + r, -hh);
      return sh;
    }

    const edgeMatGeo = new THREE.ExtrudeGeometry(makeRoundedRectShape(1.76, 0.76, 0.065), {
      depth: 0.009, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.004, bevelThickness: 0.003
    });
    edgeMatGeo.rotateX(Math.PI / 2);
    const matEdgeMaterial = new THREE.MeshStandardMaterial({ roughness: 0.80, metalness: 0.04 });
    const matEdgeMesh = new THREE.Mesh(edgeMatGeo, matEdgeMaterial);
    matEdgeMesh.position.set(0.05, 0.012, 0);
    matEdgeMesh.castShadow = false;
    matEdgeMesh.receiveShadow = false;
    matGroup.add(matEdgeMesh);

    const topMatGeo = new THREE.ExtrudeGeometry(makeRoundedRectShape(1.70, 0.70, 0.055), {
      depth: 0.012, bevelEnabled: true, bevelSegments: 3, steps: 1, bevelSize: 0.005, bevelThickness: 0.005
    });
    topMatGeo.rotateX(Math.PI / 2);
    const matTopMaterial = new THREE.MeshStandardMaterial({ roughness: 0.84, metalness: 0.03 });
    const matTopMesh = new THREE.Mesh(topMatGeo, matTopMaterial);
    matTopMesh.position.set(0.05, DIM.MAT_Y - 0.003, 0);
    matTopMesh.castShadow = false;
    matTopMesh.receiveShadow = false;
    matGroup.add(matTopMesh);
    scene.add(matGroup);

    // 2. Dynamic 3D Resistance Band (Ex 4 & 5) — uses sharedRubberMat
    const band = createDynamicBand(sharedRubberMat);
    scene.add(band.mesh);

    // 3. Pilates Mini-Ball (Ex 6) — uses exact same sharedRubberMat
    const ballMesh = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 24), sharedRubberMat);
    ballMesh.castShadow = false;
    ballMesh.receiveShadow = false;
    ballMesh.visible = false;
    scene.add(ballMesh);

    // 4. Minimalist Modern 3D Studio Chair (Ex 7, shadowless)
    const chairGroup = new THREE.Group();
    const chairMat = new THREE.MeshStandardMaterial({ roughness: 0.56, metalness: 0.12 });
    const chairLegMat = new THREE.MeshStandardMaterial({ roughness: 0.36, metalness: 0.42 });

    const seat = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.044, 0.48), chairMat);
    seat.position.set(-0.14, 0.44, 0);
    seat.castShadow = false;
    seat.receiveShadow = false;
    chairGroup.add(seat);

    const back = new THREE.Mesh(new THREE.BoxGeometry(0.040, 0.48, 0.46), chairMat);
    back.position.set(-0.36, 0.69, 0);
    back.rotation.z = 0.08;
    back.castShadow = false;
    back.receiveShadow = false;
    chairGroup.add(back);

    const legGeo = new THREE.CylinderGeometry(0.016, 0.013, 0.44, 16);
    [[-0.33, -0.20], [-0.33, 0.20], [0.05, -0.20], [0.05, 0.20]].forEach(([lx, lz]) => {
      const leg = new THREE.Mesh(legGeo, chairLegMat);
      leg.position.set(lx, 0.22, lz);
      leg.castShadow = false;
      leg.receiveShadow = false;
      chairGroup.add(leg);
    });
    chairGroup.visible = false;
    scene.add(chairGroup);

    // 5. Minimalist Studio Wall + Subtle Flat Floor Heel Ring (Ex 8, shadowless)
    const wallGroup = new THREE.Group();
    const wallMat = new THREE.MeshStandardMaterial({
      roughness: 0.62,
      metalness: 0.04
    });
    const wall = new THREE.Mesh(new THREE.BoxGeometry(0.08, 1.85, 1.15), wallMat);
    wall.position.set(0.73, 0.925, 0);
    wall.castShadow = false;
    wall.receiveShadow = false;
    wallGroup.add(wall);

    const wallTrimMat = new THREE.MeshStandardMaterial({ roughness: 0.38, metalness: 0.10 });
    const wallTrim = new THREE.Mesh(new THREE.BoxGeometry(0.085, 0.018, 1.15), wallTrimMat);
    wallTrim.position.set(0.73, 0.01, 0);
    wallTrim.castShadow = false;
    wallTrim.receiveShadow = false;
    wallGroup.add(wallTrim);

    const heelRingMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.72, side: THREE.DoubleSide });
    const heelRing = new THREE.Mesh(new THREE.RingGeometry(0.072, 0.092, 36), heelRingMat);
    heelRing.rotation.x = -Math.PI / 2;
    heelRing.castShadow = false;
    heelRing.receiveShadow = false;
    wallGroup.add(heelRing);
    wallGroup.visible = false;
    scene.add(wallGroup);

    // --- Single Clean Main 3D Mannequin (ZERO Ghost Silhouette) ---
    const hero = createMannequin();
    scene.add(hero.root);

    // --- Smooth Damped Spherical Orbit Camera ---
    const camState = {
      theta: 0.34, phi: 1.16, r: 2.05,
      tTheta: 0.34, tPhi: 1.16, tR: 2.05,
      look: new THREE.Vector3(0.06, 0.28, 0),
      tLook: new THREE.Vector3(0.06, 0.28, 0)
    };

    function applyThemeToScene(isLight) {
      const cfg = isLight ? THEME_3D.light : THEME_3D.dark;
      // Exact solid flat stage background matching CSS
      scene.background = new THREE.Color(cfg.bgHex);
      scene.fog = null;

      // Update shadowless 3-point + hemisphere lights
      hemiLight.color.setHex(cfg.hemiSky);
      hemiLight.groundColor.setHex(cfg.hemiGround);
      hemiLight.intensity = cfg.hemiInt;
      keyLight.color.setHex(cfg.keyColor);
      keyLight.intensity = cfg.keyInt;
      fillLight.color.setHex(cfg.fillColor);
      fillLight.intensity = cfg.fillInt;
      rimLight.color.setHex(cfg.rimColor);
      rimLight.intensity = cfg.rimInt;

      // Update sculpted mannequin palette
      hero.setPalette(cfg);

      // Update shared golden-amber rubber material (Resistance Band & Pilates Ball stay 100% identical)
      sharedRubberMat.color.copy(linColor(cfg.rubberHex));
      sharedRubberMat.emissive.copy(linColor(cfg.rubberEmissive));
      sharedRubberMat.roughness = cfg.rubberRoughness;
      sharedRubberMat.metalness = cfg.rubberMetalness;

      // Update exercise props
      matTopMaterial.color.copy(linColor(cfg.matTopHex));
      matEdgeMaterial.color.copy(linColor(cfg.matEdgeHex));
      chairMat.color.copy(linColor(cfg.propHex));
      chairLegMat.color.copy(linColor(cfg.propFrameHex));
      wallMat.color.copy(linColor(cfg.wallHex));
      wallTrimMat.color.copy(linColor(cfg.accentHex));
      heelRingMat.color.setHex(cfg.accentHex);
    }

    function setCameraTarget(presetObj, instant) {
      const diff = ((presetObj.theta - camState.tTheta + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
      camState.tTheta += diff;
      camState.tPhi = presetObj.phi;
      camState.tR = presetObj.r;
      camState.tLook.copy(presetObj.target);
      if (instant) {
        camState.theta = camState.tTheta;
        camState.phi = camState.tPhi;
        camState.r = camState.tR;
        camState.look.copy(camState.tLook);
      }
    }

    function updateCamera(dt) {
      const k = 1 - Math.exp(-8.5 * dt);
      camState.theta = lerp(camState.theta, camState.tTheta, k);
      camState.phi = lerp(camState.phi, camState.tPhi, k);
      camState.r = lerp(camState.r, camState.tR, k);
      camState.look.lerp(camState.tLook, k);

      const sinPhi = Math.sin(camState.phi);
      camera.position.set(
        camState.look.x + camState.r * sinPhi * Math.sin(camState.theta),
        camState.look.y + camState.r * Math.cos(camState.phi),
        camState.look.z + camState.r * sinPhi * Math.cos(camState.theta)
      );
      camera.lookAt(camState.look);
    }

    // Space the overlays take inside the stage, so the figure never sits under them.
    const FIT_MARGIN = { top: 62, bottom: 66, side: 14 };
    const PAD = 0.085;            // half a limb's thickness, in metres
    const fitCache = {};

    function fitPoints(ex, side) {
      const key = ex.id + side;
      if (fitCache[key]) return fitCache[key];
      const pts = [];
      const names = ['pelC', 'shC', 'hipR', 'hipL', 'kneeR', 'kneeL', 'ankleR', 'ankleL', 'toeR', 'toeL',
        'shR', 'shL', 'elbR', 'elbL', 'wrR', 'wrL', 'handEndR', 'handEndL'];
      ex.kfs.forEach(k => {
        const res = computeExercisePose(ex.id, k.p, side, 0);
        const P = res.pose;
        names.forEach(n => { if (P[n]) pts.push(P[n].clone()); });
        const up = new THREE.Vector3().subVectors(P.shC, P.pelC).normalize();
        const hd = P.headDir ? P.headDir.clone().normalize() : up;
        const head = P.shC.clone().addScaledVector(up, 0.035).addScaledVector(hd, DIM.NECK + 0.078);
        pts.push(head, head.clone().addScaledVector(hd, 0.1));
        if (res.ballData) pts.push(res.ballData.pos.clone().add(new THREE.Vector3(0, res.ballData.ry, 0)));
      });
      if (ex.prop === 'wall') {
        [[0.69, 0.0, -0.32], [0.69, 1.34, -0.32], [0.69, 1.34, 0.32], [0.69, 0.0, 0.32]]
          .forEach(a => pts.push(new THREE.Vector3(a[0], a[1], a[2])));
      } else if (ex.prop === 'chair') {
        [[-0.37, 0.92, 0], [-0.36, 0.0, -0.22], [0.07, 0.0, 0.22], [0.09, 0.46, 0.24]]
          .forEach(a => pts.push(new THREE.Vector3(a[0], a[1], a[2])));
      }
      fitCache[key] = pts;
      return pts;
    }

    // Distance and aim point that keep the whole movement (and its prop) inside the free area of the stage.
    function fitPreset(ex, side, preset) {
      const base = getCameraPreset(ex.id, side, preset);
      const stage = $('stage');
      const W = stage.clientWidth || 300, H = stage.clientHeight || 220;
      const availW = Math.max(80, W - 2 * FIT_MARGIN.side);
      const availH = Math.max(80, H - FIT_MARGIN.top - FIT_MARGIN.bottom);
      const tV = Math.tan(camera.fov * D2R / 2);
      const tanV = tV * availH / H;
      const tanH = tV * (W / H) * availW / W;
      const sp = Math.sin(base.phi);
      const z = new THREE.Vector3(sp * Math.sin(base.theta), Math.cos(base.phi), sp * Math.cos(base.theta)).normalize();
      const R = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), z).normalize();
      const U = new THREE.Vector3().crossVectors(z, R).normalize();
      const pts = fitPoints(ex, side);
      const c = new THREE.Box3().setFromPoints(pts).getCenter(new THREE.Vector3());
      const d = new THREE.Vector3();
      let r = 2;
      for (let it = 0; it < 3; it++) {
        r = 0;
        for (const q of pts) {
          d.subVectors(q, c);
          const dz = d.dot(z);
          r = Math.max(r, (Math.abs(d.dot(R)) + PAD) / tanH + dz, (Math.abs(d.dot(U)) + PAD) / tanV + dz);
        }
        if (it === 2) break;
        let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
        for (const q of pts) {
          d.subVectors(q, c);
          const depth = r - d.dot(z);
          const sx = d.dot(R) / depth, sy = d.dot(U) / depth;
          x0 = Math.min(x0, sx); x1 = Math.max(x1, sx); y0 = Math.min(y0, sy); y1 = Math.max(y1, sy);
        }
        c.addScaledVector(R, (x0 + x1) / 2 * r).addScaledVector(U, (y0 + y1) / 2 * r);
      }
      return { theta: base.theta, phi: base.phi, r: clamp(r, 0.9, 7), target: c };
    }

    let onResize = null;
    function resize() {
      const stage = $('stage');
      const w = stage.clientWidth || 300;
      const h = stage.clientHeight || 220;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      // Centre the picture in the area between the top and bottom overlays.
      camera.setViewOffset(w, h, 0, -(FIT_MARGIN.top - FIT_MARGIN.bottom) / 2, w, h);
      camera.updateProjectionMatrix();
      if (onResize) onResize();
    }

    if (window.ResizeObserver) new ResizeObserver(resize).observe($('stage'));
    window.addEventListener('resize', resize);
    resize();

    function setPropsForEx(ex) {
      matGroup.visible = ex.prop.startsWith('mat');
      chairGroup.visible = ex.prop === 'chair';
      wallGroup.visible = ex.prop === 'wall';
      band.mesh.visible = ex.prop === 'mat-band';
      ballMesh.visible = ex.prop === 'mat-ball';
    }

    function updateFrame(ex, p, side, timeMs, dt) {
      const res = computeExercisePose(ex.id, p, side, timeMs);
      hero.applyPose(res.pose, res.activeMuscles, p.e);

      if (res.bandData) {
        band.update(res.bandData.p1, res.bandData.p2, res.bandData.axis, res.bandData.tension);
      } else {
        band.mesh.visible = false;
      }

      if (res.ballData) {
        ballMesh.visible = true;
        ballMesh.position.copy(res.ballData.pos);
        ballMesh.scale.set(res.ballData.rx, res.ballData.ry, res.ballData.rz);
      } else {
        ballMesh.visible = false;
      }

      if (res.heelRingPos) {
        heelRing.position.copy(res.heelRingPos);
        const pulse = 1 + Math.sin(timeMs * 0.005) * 0.05;
        heelRing.scale.set(pulse, pulse, 1);
      }

      updateCamera(dt);
      renderer.render(scene, camera);
    }

    // --- Interactive 360° Pointer/Touch Orbit & Pinch/Wheel Zoom ---
    const pointers = new Map();
    let prevPinchDist = null;

    canvas.addEventListener('pointerdown', e => {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointers.size === 2) {
        const pts = Array.from(pointers.values());
        prevPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      }
    });

    canvas.addEventListener('pointermove', e => {
      if (!pointers.has(e.pointerId)) return;
      const prev = pointers.get(e.pointerId);
      const dx = e.clientX - prev.x;
      const dy = e.clientY - prev.y;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pointers.size === 1) {
        if (Math.abs(dx) > 1.5 || Math.abs(dy) > 1.5) setActiveCamPill(null);
        camState.tTheta -= dx * 0.0075;
        camState.tPhi = clamp(camState.tPhi - dy * 0.0065, 0.18, 1.48);
      } else if (pointers.size === 2) {
        const pts = Array.from(pointers.values());
        const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        if (prevPinchDist != null) {
          camState.tR = clamp(camState.tR + (prevPinchDist - dist) * 0.006, 0.9, 7);
        }
        prevPinchDist = dist;
      }
    });

    function releasePtr(e) {
      pointers.delete(e.pointerId);
      if (pointers.size < 2) prevPinchDist = null;
    }
    canvas.addEventListener('pointerup', releasePtr);
    canvas.addEventListener('pointercancel', releasePtr);

    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      camState.tR = clamp(camState.tR + e.deltaY * 0.0016, 0.9, 7);
    }, { passive: false });

    return {
      applyThemeToScene,
      setCameraTarget,
      setPropsForEx,
      updateFrame,
      fitPreset,
      setOnResize(fn) { onResize = fn; }
    };
  }

  /* ==========================================================================
     6. APPLICATION STATE, TIMELINE SAMPLER & 60FPS ANIMATION LOOP
     ========================================================================== */
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wideMQ = window.matchMedia ? window.matchMedia('(min-width: 960px)') : null;

  let cur = 0, playing = !reduced, speed = 1, clock = 0, lastTs = null;
  let lastCue = -1, lastHold = null;
  let autoCount = false, activeCam = 'auto';
  let timer = null, resetArmed = false, resetT = null, toastT = null;
  let openSheet = null, opener = null;
  let scrubbing = false, wasPlayingBeforeScrub = false;

  function sampleKF(ex, t) {
    const n = ex.kfs.length;
    let i = 0;
    while (i < n - 1 && t >= ex.kfs[i + 1].start) i++;
    const k = ex.kfs[i], prev = ex.kfs[(i - 1 + n) % n], lt = t - k.start;
    const u = lt < k.d ? ease(lt / k.d) : 1;
    const ph = lt < k.d ? 'move' : 'hold';
    const p = {};
    for (const key in k.p) p[key] = lerp(prev.p[key], k.p[key], u);
    return { p, k, ph, hf: k.h ? clamp((lt - k.d) / k.h, 0, 1) : 0 };
  }

  function peakTime(ex) {
    const k = ex.kfs[ex.peakIdx];
    return k.start + k.d + Math.min(400, k.h / 2);
  }

  function setStepHighlight(i) {
    const lis = $('steps').children;
    for (let j = 0; j < lis.length; j++) {
      const btn = lis[j].querySelector('.step-btn');
      if (btn) btn.classList.toggle('on', j === i);
    }
  }

  const VIEWS = ['auto', 'side', 'top', 'front'];
  const VIEW_NAMES = { auto: 'العرض التلقائي', side: 'عرض جانبي', top: 'عرض من فوق', front: 'عرض أمامي' };
  function setActiveCamPill(cam) {
    activeCam = cam;
    const vb = $('viewBtn');
    if (vb) vb.classList.toggle('free', cam == null);
  }
  function aimCamera(cam, instant) {
    if (!studio) return;
    const ex = EX[cur];
    studio.setCameraTarget(studio.fitPreset(ex, curSide(ex), cam), !!instant);
  }

  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(() => t.classList.remove('show'), 2600);
  }

  function syncTheme() {
    const isLight = store.theme === 'light';
    document.documentElement.setAttribute('data-theme', store.theme);
    $('metaTheme').setAttribute('content', isLight ? '#EEF2F4' : '#161A1E');
    $('themeBtn').innerHTML = isLight ? MOON : SUN;
    if (studio) studio.applyThemeToScene(isLight);
  }

  function syncPlay() {
    $('play').innerHTML = playing ? PAUSE : PLAY;
    $('play').setAttribute('aria-label', playing ? 'إيقاف الحركة مؤقتاً' : 'تشغيل الحركة');
  }

  function onAutoCycle() {
    const ex = EX[cur];
    if (!autoCount || ex.tool !== 'reps') return;
    const s = curSide(ex), r = rec(ex), before = getN(ex, s);
    r[s] = before + 1;
    saveStore();
    if (before < store.goal && r[s] >= store.goal) toast('أحسنت، وصلت للهدف');
    renderTool();
    renderNav();
  }

  function drawFrame(now, dt) {
    const ex = EX[cur];
    const t = ((clock % ex.total) + ex.total) % ex.total;
    const s = sampleKF(ex, t);

    if (studio) studio.updateFrame(ex, s.p, curSide(ex), now, dt);

    if (s.k.cue !== lastCue) {
      lastCue = s.k.cue;
      setStepHighlight(lastCue);
    }
    const showHold = !!(s.k.hold && s.ph === 'hold');
    if (showHold !== lastHold) {
      lastHold = showHold;
      $('hold').hidden = !showHold;
    }
    if (showHold) $('holdBar').style.width = (s.hf * 100).toFixed(1) + '%';

    const pct = (t / ex.total) * 100;
    $('scrubFill').style.width = pct.toFixed(2) + '%';
    $('scrubThumb').style.left = pct.toFixed(2) + '%';
    $('scrubber').setAttribute('aria-valuenow', Math.round(pct));
  }

  function animateLoop(ts) {
    if (lastTs == null) lastTs = ts;
    const dtMs = Math.min(64, ts - lastTs);
    lastTs = ts;

    if (playing && !scrubbing) {
      const ex = EX[cur];
      const prevCycle = Math.floor(clock / ex.total);
      clock += dtMs * speed;
      const nextCycle = Math.floor(clock / ex.total);
      if (nextCycle > prevCycle) onAutoCycle();
    }
    drawFrame(ts, dtMs / 1000);
    requestAnimationFrame(animateLoop);
  }

  /* ==========================================================================
     7. UI RENDERERS (SIDE PANEL, EXERCISE LIST, COUNTER / TIMER DOCK)
     ========================================================================== */
  const CS = 2 * Math.PI * 27;

  function renderInfo() {
    const ex = EX[cur];
    $('exNum').textContent = ex.id;
    $('dNum').textContent = ex.id;
    $('exTitle').textContent = ex.name;
    $('dTitle').textContent = ex.name;
    $('dMuscle').textContent = ex.muscle;
    $('stMuscle').textContent = ex.muscle;
    $('glCanvas').setAttribute('aria-label', 'مجسم ثلاثي الأبعاد لتمرين ' + ex.name + '، والعضلة المستهدفة: ' + ex.muscle);

    const sh = $('scrubHold');
    if (ex.holdSpan) {
      sh.hidden = false;
      sh.style.left = ((ex.holdSpan.start / ex.total) * 100).toFixed(2) + '%';
      sh.style.width = (((ex.holdSpan.end - ex.holdSpan.start) / ex.total) * 100).toFixed(2) + '%';
    } else {
      sh.hidden = true;
    }

    $('steps').innerHTML = ex.steps.map((st, idx) =>
      '<li><button type="button" class="step-btn" data-act="jump" data-step="' + idx + '"><span class="num">' + (idx + 1) + '</span><span>' + st + '</span></button></li>'
    ).join('');
    $('tags').innerHTML = ex.tags.map(t => '<span class="tag">' + svgIcon(TAGS[t][1]) + TAGS[t][0] + '</span>').join('');
    lastCue = -1;
    lastHold = null;
    renderTool();
  }

  function renderNav() {
    $('segs').innerHTML = EX.map((ex, i) =>
      '<button type="button" class="seg-b' + (isDone(ex) ? ' done' : '') + '" data-act="go" data-i="' + i + '" aria-label="تمرين ' + ex.id + ': ' + ex.name + '"' + (i === cur ? ' aria-current="step"' : '') + '><i></i></button>'
    ).join('');
    $('exlist').innerHTML = EX.map((ex, i) =>
      '<button type="button" class="exrow" data-act="go" data-i="' + i + '"' + (i === cur ? ' aria-current="true"' : '') + '><span class="n">' + ex.id + '</span><span class="t"><b>' + ex.name + '</b><span>' + ex.muscle + '</span></span>' + (isDone(ex) ? '<span class="ok" aria-label="مكتمل">' + CHECK + '</span>' : '') + '</button>'
    ).join('');
    updateProgress();
  }

  function updateProgress() {
    const n = EX.filter(isDone).length;
    document.querySelectorAll('.doneCount').forEach(e => { e.textContent = n; });
    $('dayBar').style.width = (n / EX.length * 100) + '%';
    const segs = $('segs').children;
    for (let i = 0; i < segs.length; i++) segs[i].classList.toggle('done', isDone(EX[i]));
  }

  function mring(frac, big, small) {
    frac = clamp(frac, 0, 1);
    return '<div class="mring' + (frac >= 1 ? ' full' : '') + '"><svg viewBox="0 0 62 62" aria-hidden="true"><circle class="track" cx="31" cy="31" r="27" fill="none" stroke-width="5.5"></circle><circle class="val" id="ringVal" cx="31" cy="31" r="27" fill="none" stroke-width="5.5" stroke-dasharray="' + CS.toFixed(1) + '" stroke-dashoffset="' + (CS * (1 - frac)).toFixed(1) + '"></circle></svg><div class="mring-t"><b id="ringBig">' + big + '</b><span>' + small + '</span></div></div>';
  }

  function resetBtn() {
    return '<button type="button" class="soft' + (resetArmed ? ' armed' : '') + '" data-act="reset">' + (resetArmed ? 'اضغط مرة ثانية للتأكيد' : 'تصفير عدّاد اليوم') + '</button>';
  }

  function renderTool() {
    const ex = EX[cur], s = curSide(ex);
    const run = timer && timer.ex === ex.id;
    let h = '', m = '';

    if (ex.sides) {
      h += '<div class="seg" role="group" aria-label="اختر الرجل">' + ['R', 'L'].map(x =>
        '<button type="button" class="seg-btn" data-act="side" data-side="' + x + '" aria-pressed="' + (x === s) + '">' + (x === 'R' ? 'اليمنى' : 'اليسرى') + '<span class="seg-n">' + sideSum(ex, x) + '</span></button>'
      ).join('') + '</div>';
    } else {
      h += '<div class="seg seg-ph" aria-hidden="true"><span class="seg-btn"></span><span class="seg-btn"></span></div>';
    }

    if (ex.tool === 'reps') {
      const n = getN(ex, s);
      h += '<div class="toolrow">' +
        mring(n / store.goal, n, 'من ' + store.goal) +
        '<button type="button" class="act" data-act="plus" data-v="1">+1 تكرار</button>' +
        '<button type="button" class="round" data-act="plus" data-v="-1" aria-label="إنقاص تكرار واحد">−1</button>' +
      '</div>';

      m += '<h3>عدّاد اليوم</h3>' +
        '<div class="more-row"><span id="autoLbl">عدّ تلقائي مع حركة المجسم</span><button type="button" class="switch" role="switch" aria-labelledby="autoLbl" aria-checked="' + autoCount + '" data-act="auto"><i></i></button></div>' +
        '<div class="more-row"><span>الهدف اليومي' + (ex.sides ? ' لكل رجل' : '') + '</span>' +
        '<div class="stepper"><button type="button" data-act="goal" data-v="-10" aria-label="تقليل الهدف">−</button><b>' + store.goal + '</b><button type="button" data-act="goal" data-v="10" aria-label="زيادة الهدف">+</button></div></div>' +
        '<div class="more-row"><button type="button" class="soft" data-act="plus" data-v="10">إضافة 10 تكرارات</button>' + resetBtn() + '</div>';
    } else if (ex.tool === 'hold') {
      const v = getN(ex, s);
      h += '<div class="toolrow"><div class="clockbox"><b id="clock">' + (run ? fmt((performance.now() - timer.t0) / 1000) : '0:00') + '</b><span>أفضل ' + (v.n ? fmt(v.best) : '—') + ' · ' + v.n + ' مرات</span></div><button type="button" class="act' + (run ? ' stop' : '') + '" data-act="hold">' + (run ? 'إيقاف وتسجيل' : 'ابدأ الثبات') + '</button></div>';
      m += '<h3>مؤقّت الثبات</h3><div class="more-row">' + resetBtn() + '</div>';
    } else {
      const c = getN(ex, s);
      const left = run ? Math.max(0, 30 - (performance.now() - timer.t0) / 1000) : 30;
      h += '<div class="toolrow">' + mring(run ? (30 - left) / 30 : 0, Math.ceil(left), 'ثانية') + '<button type="button" class="act' + (run ? ' stop' : '') + '" data-act="cd">' + (run ? 'إيقاف' : 'ابدأ 30 ثانية') + '</button><span class="round" aria-label="مرات الثبات اليوم">' + c + '×</span></div>';
      m += '<h3>مؤقّت 30 ثانية</h3><div class="more-row">' + resetBtn() + '</div>';
    }

    $('tool').innerHTML = h;
    $('toolMore').innerHTML = m;
  }

  /* ---------- Silent Visual Timers (ZERO Audio API) ---------- */
  function stopTimer(record) {
    if (!timer) return;
    const ex = EX.find(e => e.id === timer.ex);
    const sec = (performance.now() - timer.t0) / 1000;
    if (record && ex.tool === 'hold' && sec >= 1) {
      const r = rec(ex), v = getN(ex, timer.side);
      r[timer.side] = { best: Math.max(v.best, Math.floor(sec)), n: v.n + 1 };
      saveStore();
      toast('سُجّل الثبات: ' + fmt(sec));
    }
    timer = null;
  }

  setInterval(() => {
    if (!timer) return;
    const ex = EX[cur];
    if (ex.id !== timer.ex) return;
    const sec = (performance.now() - timer.t0) / 1000;
    if (ex.tool === 'hold') {
      const c = $('clock');
      if (c) c.textContent = fmt(sec);
    } else {
      if (sec >= 30) {
        const r = rec(ex);
        r[timer.side] = getN(ex, timer.side) + 1;
        saveStore();
        timer = null;
        toast('أحسنت، اكتملت 30 ثانية');
        renderTool();
        renderNav();
        return;
      }
      const left = 30 - sec, b = $('ringBig'), rv = $('ringVal');
      if (b) b.textContent = Math.ceil(left);
      if (rv) rv.setAttribute('stroke-dashoffset', (CS * (left / 30)).toFixed(1));
    }
  }, 150);

  /* ---------- Modals & Bottom Sheets ---------- */
  function showSheet(el, from) {
    if (openSheet) closeSheet(true);
    opener = from || document.activeElement;
    el.classList.add('open');
    el.setAttribute('role', 'dialog');
    el.setAttribute('aria-modal', 'true');
    $('scrim').classList.add('show');
    openSheet = el;
    const c = el.querySelector('.close');
    if (c) setTimeout(() => c.focus({ preventScroll: true }), 50);
  }
  function closeSheet(silent) {
    if (!openSheet) return;
    openSheet.classList.remove('open');
    openSheet.removeAttribute('role');
    openSheet.removeAttribute('aria-modal');
    $('scrim').classList.remove('show');
    openSheet = null;
    if (!silent && opener && opener.focus) opener.focus({ preventScroll: true });
  }
  if (wideMQ && wideMQ.addEventListener) {
    wideMQ.addEventListener('change', () => { if (wideMQ.matches && openSheet === $('detail')) closeSheet(true); });
  }

  /* ---------- Exercise Navigation ---------- */
  function setEx(i, fromHash, instantCam) {
    i = (i + EX.length) % EX.length;
    if (timer) stopTimer(true);
    cur = i;
    resetArmed = false;
    const ex = EX[cur];
    const side = curSide(ex);
    clock = playing ? 0 : peakTime(ex);

    if (studio) {
      studio.setPropsForEx(ex);
      setActiveCamPill('auto');
      studio.setCameraTarget(studio.fitPreset(ex, side, 'auto'), !!instantCam);
    }

    renderInfo();
    renderNav();
    if (!fromHash) { try { history.replaceState(null, '', '#ex-' + ex.id); } catch (e) {} }
  }

  function jumpToStep(stepIdx) {
    const ex = EX[cur];
    const kf = ex.kfs.find(k => k.cue === stepIdx);
    if (kf) clock = kf.start + kf.d * 0.72;
  }

  /* ==========================================================================
     8. EVENT DELEGATION, SCRUBBER, KEYBOARD & WAKE LOCK
     ========================================================================== */
  document.addEventListener('click', ev => {
    const b = ev.target.closest('[data-act]');
    if (!b) return;
    const act = b.getAttribute('data-act'), ex = EX[cur], s = curSide(ex);

    if (act === 'list') { showSheet($('listSheet'), b); return; }
    if (act === 'info') { showSheet($('detail'), b); return; }
    if (act === 'close') { closeSheet(); return; }
    if (act === 'go') {
      const gi = Number(b.getAttribute('data-i'));
      closeSheet(true);
      if (gi !== cur) setEx(gi);
      return;
    }
    if (act === 'prev') { setEx(cur - 1); return; }
    if (act === 'next') { setEx(cur + 1); return; }
    if (act === 'play') { playing = !playing; syncPlay(); return; }
    if (act === 'speed') {
      speed = speed === 1 ? 0.55 : 1;
      b.textContent = 'السرعة: ' + (speed === 1 ? 'عادية' : 'بطيئة');
      b.classList.toggle('slow', speed < 1);
      return;
    }
    if (act === 'theme') {
      store.theme = store.theme === 'dark' ? 'light' : 'dark';
      saveStore();
      syncTheme();
      return;
    }
    if (act === 'view') {
      const next = activeCam == null ? 'auto' : VIEWS[(VIEWS.indexOf(activeCam) + 1) % VIEWS.length];
      setActiveCamPill(next);
      aimCamera(next, false);
      toast(VIEW_NAMES[next]);
      return;
    }
    if (act === 'jump') {
      jumpToStep(Number(b.getAttribute('data-step')));
      return;
    }
    if (act === 'auto') {
      autoCount = !autoCount;
      if (autoCount && !playing) { playing = true; syncPlay(); }
      toast(autoCount ? 'العدّ التلقائي مفعّل' : 'تم إيقاف العدّ التلقائي');
      renderTool();
      return;
    }

    if (act !== 'reset') { resetArmed = false; clearTimeout(resetT); }

    if (act === 'side') {
      const ns = b.getAttribute('data-side');
      if (ns !== s) {
        if (timer) stopTimer(true);
        store.side[ex.id] = ns;
        saveStore();
        if (studio && activeCam) {
          studio.setCameraTarget(studio.fitPreset(ex, ns, activeCam), false);
        }
      }
    } else if (act === 'plus') {
      const dv = Number(b.getAttribute('data-v')), r = rec(ex), before = getN(ex, s);
      r[s] = Math.max(0, before + dv);
      saveStore();
      if (dv > 0 && before < store.goal && r[s] >= store.goal) toast('أحسنت، وصلت للهدف');
      else if (dv === 10) toast('أُضيفت 10 تكرارات');
    } else if (act === 'goal') {
      store.goal = clamp(store.goal + Number(b.getAttribute('data-v')), 10, 500);
      saveStore();
    } else if (act === 'reset') {
      if (!resetArmed) {
        resetArmed = true;
        clearTimeout(resetT);
        resetT = setTimeout(() => { resetArmed = false; renderTool(); }, 3500);
      } else {
        resetArmed = false;
        clearTimeout(resetT);
        if (timer && timer.ex === ex.id) timer = null;
        delete rec(ex)[s];
        saveStore();
        toast('تم تصفير عدّاد اليوم');
      }
    } else if (act === 'hold') {
      if (timer && timer.ex === ex.id) stopTimer(true);
      else timer = { ex: ex.id, side: s, t0: performance.now() };
    } else if (act === 'cd') {
      if (timer && timer.ex === ex.id) { stopTimer(false); toast('أُوقف المؤقّت'); }
      else timer = { ex: ex.id, side: s, t0: performance.now() };
    } else {
      return;
    }

    const inMore = !!b.closest('#toolMore');
    renderTool();
    renderNav();
    const sel = '[data-act="' + act + '"]' + (act === 'side' ? '[data-side="' + b.getAttribute('data-side') + '"]' : (b.getAttribute('data-v') ? '[data-v="' + b.getAttribute('data-v') + '"]' : ''));
    const again = $(inMore ? 'toolMore' : 'tool').querySelector(sel);
    if (again) again.focus({ preventScroll: true });
  });

  // Interactive Silent Timeline Scrubber (Pointer Drag & Click)
  const scrubber = $('scrubber');
  function scrubFromX(clientX) {
    const rect = scrubber.querySelector('.scrub-track').getBoundingClientRect();
    const ratio = clamp((clientX - rect.left) / rect.width, 0, 1);
    clock = ratio * EX[cur].total;
  }
  scrubber.addEventListener('pointerdown', e => {
    e.stopPropagation();
    scrubbing = true;
    wasPlayingBeforeScrub = playing;
    scrubber.classList.add('dragging');
    try { scrubber.setPointerCapture(e.pointerId); } catch (err) {}
    scrubFromX(e.clientX);
  });
  scrubber.addEventListener('pointermove', e => {
    if (!scrubbing) return;
    e.stopPropagation();
    scrubFromX(e.clientX);
  });
  function stopScrub(e) {
    if (!scrubbing) return;
    scrubbing = false;
    scrubber.classList.remove('dragging');
    try { scrubber.releasePointerCapture(e.pointerId); } catch (err) {}
    playing = wasPlayingBeforeScrub;
  }
  scrubber.addEventListener('pointerup', stopScrub);
  scrubber.addEventListener('pointercancel', stopScrub);

  // Keyboard Navigation
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && openSheet) { e.preventDefault(); closeSheet(); return; }
    if (openSheet) return;
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); setEx(cur + 1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); setEx(cur - 1); }
    else if (e.key === ' ') { e.preventDefault(); playing = !playing; syncPlay(); }
  });

  function fromHash() {
    const m = /^#ex-([1-8])$/.exec(location.hash || '');
    return m ? Number(m[1]) - 1 : null;
  }
  window.addEventListener('hashchange', () => {
    const h = fromHash();
    if (h != null && h !== cur) setEx(h, true, false);
  });

  // Screen Wake Lock
  let wl = null;
  function lockScreen() {
    try {
      if (!wl && navigator.wakeLock && document.visibilityState === 'visible') {
        navigator.wakeLock.request('screen').then(l => {
          wl = l;
          l.addEventListener('release', () => { wl = null; });
        }).catch(() => {});
      }
    } catch (e) {}
  }
  document.addEventListener('pointerdown', lockScreen);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      lockScreen();
      if (store.date !== today()) {
        Object.assign(store, loadStore());
        renderTool();
        renderNav();
      }
    }
  });

  // Boot 3D Studio & Animation Loop on Window Load
  let booted = false;
  function boot() {
    if (booted) return;
    booted = true;
    studio = initStudio();
    if (studio) {
      let rt = null;
      studio.setOnResize(() => {
        clearTimeout(rt);
        rt = setTimeout(() => { if (activeCam) aimCamera(activeCam, true); }, 60);
      });
    }
    syncTheme();
    syncPlay();
    const startIdx = fromHash();
    setEx(startIdx == null ? 0 : startIdx, true, true);
    requestAnimationFrame(animateLoop);
  }
  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
})();
</script>

if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});}
</script>
