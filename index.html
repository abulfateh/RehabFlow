<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="شرح متحرك لتمارين العلاج الطبيعي مع عدّاد تكرار ومؤقّت.">
<meta name="theme-color" content="#EBF1EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1517" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>تمارين العلاج الطبيعي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: one-screen app shell. Header (title + 8 progress segments) / flexible stage with the animated mannequin / step line / counter dock / navigation. Details and the exercise list slide up as sheets on phones; on wide screens details sit in a side panel. */
:root{
  --bg:#EBF1EE; --surface:#FFFFFF; --surface-2:#F2F6F4; --line:#D8E2DE;
  --ink:#16252A; --muted:#55686C;
  --accent:#1D6A64; --accent-ink:#FFFFFF; --accent-soft:#DBEAE6;
  --muscle:#D3583F; --muscle-soft:#FBE6DF; --muscle-ink:#9A3825; --on-muscle:#FFFFFF;
  --fig:#AEBFC5; --fig-far:#8BA0A8; --fig-hi:#DDE6E9; --ghost:#7E959C;
  --stage:#F4F8F6; --grid:#DCE6E2; --floor:#C7D4D6; --mat:#E2EBE8; --prop:#C6D3D6;
  --band:#3874AC; --ball:#E8CF8C; --ball-line:#BB9F5A;
  --scrim:rgba(14,26,28,.42);
  --shadow:0 1px 2px rgba(22,37,42,.06), 0 6px 20px rgba(22,37,42,.05);
  --f-display:'Readex Pro','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Arabic','Readex Pro',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1517; --surface:#142024; --surface-2:#1A292D; --line:#263A3E;
    --ink:#E3ECEA; --muted:#97AAAD;
    --accent:#5DB5AA; --accent-ink:#08191A; --accent-soft:#1B3A37;
    --muscle:#EF8068; --muscle-soft:#3A231E; --muscle-ink:#F6A893; --on-muscle:#1C0E0A;
    --fig:#62777E; --fig-far:#4A5E64; --fig-hi:#86A0A7; --ghost:#86A0A7;
    --stage:#101C1F; --grid:#1B2B2E; --floor:#2B3D41; --mat:#17262A; --prop:#33474C;
    --band:#71A9DC; --ball:#C7AC60; --ball-line:#94793A;
    --scrim:rgba(0,0,0,.6);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1517; --surface:#142024; --surface-2:#1A292D; --line:#263A3E;
  --ink:#E3ECEA; --muted:#97AAAD;
  --accent:#5DB5AA; --accent-ink:#08191A; --accent-soft:#1B3A37;
  --muscle:#EF8068; --muscle-soft:#3A231E; --muscle-ink:#F6A893; --on-muscle:#1C0E0A;
  --fig:#62777E; --fig-far:#4A5E64; --fig-hi:#86A0A7; --ghost:#86A0A7;
  --stage:#101C1F; --grid:#1B2B2E; --floor:#2B3D41; --mat:#17262A; --prop:#33474C;
  --band:#71A9DC; --ball:#C7AC60; --ball-line:#94793A;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.shell{height:100%;max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px}

/* header */
.bar{display:flex;align-items:center;gap:10px}
.ibtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex-shrink:0}
.ibtn svg{width:22px;height:22px}
.bar-t{flex:1;min-width:0;line-height:1.25}
.bar-t small{display:block;color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.bar-t h1{margin:0;font-family:var(--f-display);font-weight:600;font-size:clamp(1.08rem,.95rem + .7vw,1.45rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.daychip{display:none;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.86rem;color:var(--muted);white-space:nowrap}
.daychip b{color:var(--ink);font-variant-numeric:tabular-nums}
@media (min-width:640px){.daychip{display:inline-flex}}
.segs{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;margin-top:-2px}
.seg-b{height:20px;border:0;padding:0;background:none;display:flex;align-items:center}
.seg-b i{display:block;width:100%;height:5px;border-radius:99px;background:var(--line);transition:background .25s}
.seg-b.done i{background:var(--accent-soft)}
.seg-b[aria-current="step"] i{background:var(--accent)}

/* main */
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.col{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.stage{flex:1;min-height:150px;position:relative;border-radius:22px;border:1px solid var(--line);overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;background-color:var(--stage);background-image:radial-gradient(var(--grid) 1.2px,transparent 1.4px);background-size:16px 16px}
#fig{position:absolute;top:46px;left:0;width:100%;height:calc(100% - 90px);display:block}
#fig.swap{animation:swapIn .36s ease-out}
@keyframes swapIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.cue{position:absolute;top:10px;inset-inline-start:10px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);padding:5px 13px;border-radius:999px;font-weight:600;font-size:clamp(.88rem,.8rem + .35vw,1.05rem);box-shadow:var(--shadow);max-width:calc(100% - 20px)}
.cue-dot{width:8px;height:8px;border-radius:50%;background:var(--muscle);flex-shrink:0;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.75)}}
.hold{position:absolute;top:52px;inset-inline-start:10px;display:flex;align-items:center;gap:8px;background:var(--muscle-soft);color:var(--muscle-ink);padding:3px 12px;border-radius:999px;font-size:.82rem;font-weight:600}
.hold-bar{width:56px;height:5px;border-radius:99px;background:var(--surface);overflow:hidden;display:block}
.hold-bar i{display:block;height:100%;width:0;background:var(--muscle)}
.view-chip{position:absolute;top:10px;inset-inline-end:10px;background:var(--surface);border:1px solid var(--line);color:var(--muted);padding:3px 11px;border-radius:999px;font-size:.78rem}
.mchip{position:absolute;bottom:12px;inset-inline-start:10px;display:flex;align-items:center;gap:7px;max-width:calc(100% - 20px);background:var(--surface);border:1px solid var(--line);padding:4px 12px;border-radius:999px;font-size:.84rem;font-weight:600;color:var(--muscle-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mchip i{width:9px;height:9px;border-radius:50%;background:var(--muscle);flex-shrink:0}
.cycle{position:absolute;bottom:0;inset-inline:0;height:3px}
.cycle i{display:block;height:100%;width:0;background:var(--accent);opacity:.55}
.toast{position:absolute;bottom:50px;left:50%;transform:translate(-50%,8px);background:var(--ink);color:var(--bg);padding:7px 16px;border-radius:999px;font-size:.88rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap;max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* step line */
.stepline{display:flex;align-items:center;gap:10px;padding-inline:4px;min-height:3.05em}
.stepline .sn{flex-shrink:0;min-width:40px;height:28px;padding-inline:8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:.82rem;font-variant-numeric:tabular-nums}
.stepline p{margin:0;font-size:1.02rem;font-weight:500;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stepline p.fade{animation:fadeIn .3s ease-out}
@keyframes fadeIn{from{opacity:.2}to{opacity:1}}

/* counter dock */
.dock{display:flex;flex-direction:column;gap:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface-2);border:1px solid var(--line);padding:3px;border-radius:14px}
.seg-btn{min-height:40px;border:0;border-radius:11px;background:transparent;font-weight:600;font-size:.92rem;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
.seg-btn[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg-n{font-variant-numeric:tabular-nums;font-size:.78rem;background:var(--accent-soft);color:var(--accent);padding:0 8px;border-radius:99px}
.toolrow{display:flex;align-items:center;gap:12px;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.mring{width:64px;height:64px;position:relative;flex-shrink:0}
.mring svg{width:100%;height:100%;transform:rotate(-90deg)}
.mring .track{stroke:var(--surface-2)}
.mring .val{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .3s}
.mring.full .val{stroke:var(--muscle)}
.mring-t{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.05}
.mring-t b{font-family:var(--f-display);font-size:1.22rem;font-weight:600;font-variant-numeric:tabular-nums}
.mring-t span{font-size:.66rem;color:var(--muted);font-variant-numeric:tabular-nums}
.clockbox{min-width:84px;text-align:center;line-height:1.15;flex-shrink:0}
.clockbox b{display:block;font-family:var(--f-display);font-size:1.75rem;font-weight:600;font-variant-numeric:tabular-nums}
.clockbox span{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.act{flex:1;min-width:0;min-height:56px;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:600;font-size:1.12rem;transition:transform .1s}
.act:active{transform:scale(.97)}
.act.stop{background:var(--muscle);color:var(--on-muscle)}
.round{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;flex-shrink:0;font-weight:700;font-variant-numeric:tabular-nums}
.round svg{width:22px;height:22px}

/* nav */
.navrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.navbtn{height:48px;min-width:48px;padding-inline:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600}
.navbtn svg{width:20px;height:20px;flex-shrink:0}
.navbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mid{display:flex;align-items:center;gap:8px}
.chip-btn{height:44px;padding-inline:14px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:.84rem;color:var(--muted);font-weight:500;white-space:nowrap}
@media (max-width:420px){.navbtn span{display:none}.navbtn{padding:0}}

/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:30;max-height:86%;overflow:auto;overscroll-behavior:contain;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.18);padding-block:8px calc(20px + env(safe-area-inset-bottom,0px));padding-inline:max(20px,env(safe-area-inset-left,0px)) max(20px,env(safe-area-inset-right,0px));transform:translateY(105%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s linear .3s}
.sheet.open{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s}
.sheet-head{position:sticky;top:-8px;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:8px 6px;background:var(--surface)}
.grab{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:40px;height:4px;border-radius:99px;background:var(--line)}
.sheet-head h2{margin:6px 0 0;font-family:var(--f-display);font-weight:600;font-size:1.25rem}
.close{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center;margin-top:6px}
.close svg{width:20px;height:20px}

/* details */
.detail{display:flex;flex-direction:column;gap:14px}
.eyebrow{margin:0;color:var(--muted);font-size:.84rem;font-variant-numeric:tabular-nums}
.d-title{margin:0;font-family:var(--f-display);font-weight:600;font-size:clamp(1.35rem,1.1rem + 1vw,1.9rem);line-height:1.2;text-wrap:balance}
.muscle{display:inline-flex;align-self:flex-start;align-items:center;gap:8px;background:var(--muscle-soft);color:var(--muscle-ink);padding:5px 14px;border-radius:999px;font-weight:600;font-size:.92rem}
.muscle i{width:9px;height:9px;border-radius:50%;background:var(--muscle);display:inline-block}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:center;padding:9px 12px;border-radius:14px;color:var(--muted);transition:background .3s,color .3s}
.steps li::before{content:counter(s);flex-shrink:0;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-family:var(--f-display);font-weight:600;font-size:.85rem}
.steps li.on{background:var(--accent-soft);color:var(--ink);font-weight:500}
.steps li.on::before{background:var(--accent);color:var(--accent-ink)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:.85rem;font-weight:500}
.tag svg{width:16px;height:16px;flex-shrink:0;color:var(--accent)}
.more{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.more h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:1rem}
.more-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:12px;padding:3px}
.stepper button{width:44px;height:40px;border:0;border-radius:9px;background:var(--surface);font-weight:700;font-size:1.1rem}
.stepper b{min-width:44px;text-align:center;color:var(--ink);font-variant-numeric:tabular-nums}
.soft{min-height:44px;padding-inline:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-weight:600}
.soft.armed{background:var(--muscle-soft);color:var(--muscle-ink);border-color:var(--muscle)}
.note{margin:0;font-size:.82rem;color:var(--muted)}
.safety{margin:0;display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:.85rem;background:var(--surface-2);padding:12px 14px;border-radius:14px}
.safety svg{width:18px;height:18px;flex-shrink:0;margin-top:2px;color:var(--accent)}

/* exercise list */
.daysum{display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--muted);margin-bottom:6px}
.daysum b{color:var(--ink);font-variant-numeric:tabular-nums}
.daybar{flex:1;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.daybar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .4s}
.exlist{display:flex;flex-direction:column;gap:6px}
.exrow{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:10px 12px;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.exrow[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.exrow .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-family:var(--f-display);font-weight:600;flex-shrink:0}
.exrow[aria-current="true"] .n{background:var(--accent);color:var(--accent-ink)}
.exrow .t{flex:1;min-width:0;line-height:1.3}
.exrow .t b{display:block;font-weight:600}
.exrow .t span{font-size:.8rem;color:var(--muted)}
.exrow .ok{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);flex-shrink:0}
.exrow .ok svg{width:15px;height:15px}

/* wide screens: details become a side panel; the list sheet becomes a centered panel */
@media (min-width:960px){
  .shell{padding-block:16px 18px;gap:12px}
  .main{grid-template-columns:minmax(0,1fr) 370px;gap:16px}
  #infoBtn{display:none}
  .detail.sheet{position:static;transform:none;visibility:visible;max-height:none;border-radius:22px;border:1px solid var(--line);box-shadow:var(--shadow);padding:22px;transition:none;z-index:auto;min-height:0}
  .detail .sheet-head{display:none}
  #listSheet{inset:auto;top:50%;left:50%;bottom:auto;width:min(540px,92vw);max-height:84%;border-radius:24px;transform:translate(-50%,-46%);opacity:0;padding-bottom:20px}
  #listSheet.open{transform:translate(-50%,-50%);opacity:1}
  #listSheet .grab{display:none}
}
/* phones held sideways */
@media (orientation:landscape) and (max-height:520px){
  .shell{gap:6px;padding-block:6px 8px}
  .segs{display:none}
  .col{flex-direction:row;gap:10px}
  .stage{min-height:0}
  .dock-wrap{width:48%;flex-shrink:0;overflow:auto}
  .stepline{min-height:0}
}
.dock-wrap{display:flex;flex-direction:column;gap:10px}

/* mannequin */
.limb,.sheen,.mus,.glow,.band,.arrow,.prop,.floor,.gh{fill:none;stroke-linecap:round;stroke-linejoin:round}
.limb.near,.limb.torso{stroke:var(--fig)}
.limb.far{stroke:var(--fig-far)}
.sheen{stroke:var(--fig-hi);opacity:.6}
.sheen.far{opacity:.28}
.head{fill:var(--fig)}
.head-hi{fill:var(--fig-hi);opacity:.55}
.mus,.glow{stroke:var(--muscle)}
.band{stroke:var(--band);stroke-dasharray:9 6}
.arrow{stroke:var(--accent)}
.ball{fill:var(--ball);stroke:var(--ball-line);stroke-width:2}
.ball-hi{fill:var(--surface);opacity:.5}
.shadow{fill:var(--floor);opacity:.6}
.floor{stroke:var(--floor)}
.prop{stroke:var(--prop)}
.mat{fill:var(--mat)}
.wall{fill:var(--prop)}
#gGhost{opacity:.2}
.gh{stroke:var(--ghost)}
.ghh{fill:var(--ghost)}

@media (prefers-reduced-motion: reduce){
  #fig.swap,.stepline p.fade{animation:none}
  .cue-dot{animation:none}
  .sheet,.sheet.open,.scrim,.toast,.seg-b i,.mring .val,.steps li{transition:none}
}
</style>
<style>
html{-webkit-text-size-adjust:100%;color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;overscroll-behavior:none}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="shell" dir="rtl" lang="ar">
  <header>
    <div class="bar">
      <button type="button" class="ibtn" id="listBtn" data-act="list" aria-label="قائمة التمارين"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"></rect><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"></rect><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"></rect><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"></rect></svg></button>
      <div class="bar-t">
        <small>تمرين <span id="exNum">1</span> من 8</small>
        <h1 id="exTitle"></h1>

    if(again) again.focus({preventScroll:true});
  });

  var sx=null, sy=null;
  $('stage').addEventListener('pointerdown',function(e){ sx=e.clientX; sy=e.clientY; });
  $('stage').addEventListener('pointerup',function(e){
    if(sx==null) return; var dx=e.clientX-sx, dy=e.clientY-sy; sx=null;
    if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.3) setEx(dx>0?cur+1:cur-1);
  });
  $('stage').addEventListener('pointercancel',function(){ sx=null; });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape' && openSheet){ e.preventDefault(); closeSheet(); return; }
    if(openSheet) return;
    if(e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if(e.key==='ArrowLeft'){ e.preventDefault(); setEx(cur+1); }
    else if(e.key==='ArrowRight'){ e.preventDefault(); setEx(cur-1); }
  });
  function fromHash(){ var m=/^#ex-([1-8])$/.exec(location.hash||''); return m?Number(m[1])-1:null; }
  window.addEventListener('hashchange',function(){ var h=fromHash(); if(h!=null && h!==cur) setEx(h,true); });

  var wl=null;
  function lock(){ try{ if(!wl && navigator.wakeLock && document.visibilityState==='visible'){ navigator.wakeLock.request('screen').then(function(l){ wl=l; l.addEventListener('release',function(){ wl=null; }); }).catch(function(){}); } }catch(e){} }
  document.addEventListener('pointerdown',lock);
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible'){ lock(); if(store.date!==today()){ store=load(); renderTool(); renderNav(); } }
  });

  syncPlay();
  var start=fromHash();
  setEx(start==null?0:start,true);
  requestAnimationFrame(frame);
})();
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});}
</script>
