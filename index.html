<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="شرح متحرك لتمارين العلاج الطبيعي مع عدّاد تكرار ومؤقّت.">
<meta name="theme-color" content="#1D6A64" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1517" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>تمارين العلاج الطبيعي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: brand bar + exercise strip on top; a live "stage" with the animated mannequin beside a coaching panel (steps, counter, timer) on wide screens, stacked on phones. */
:root{
  --bg:#EBF1EE; --surface:#FFFFFF; --surface-2:#F2F6F4; --line:#D8E2DE;
  --ink:#16252A; --muted:#55686C;
  --accent:#1D6A64; --accent-ink:#FFFFFF; --accent-soft:#DBEAE6;
  --muscle:#D3583F; --muscle-soft:#FBE6DF; --muscle-ink:#9A3825; --on-muscle:#FFFFFF;
  --fig:#AEBFC5; --fig-far:#8BA0A8; --fig-hi:#DDE6E9; --ghost:#7E959C;
  --stage:#F4F8F6; --grid:#DFE8E5; --floor:#C7D4D6; --mat:#E2EBE8; --prop:#C6D3D6;
  --band:#3874AC; --ball:#E8CF8C; --ball-line:#BB9F5A;
  --shadow:0 1px 2px rgba(22,37,42,.06), 0 6px 20px rgba(22,37,42,.05);
  --f-display:'Readex Pro','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Arabic','Readex Pro',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1517; --surface:#142024; --surface-2:#1A292D; --line:#263A3E;
    --ink:#E3ECEA; --muted:#97AAAD;
    --accent:#5DB5AA; --accent-ink:#08191A; --accent-soft:#1B3A37;
    --muscle:#EF8068; --muscle-soft:#3A231E; --muscle-ink:#F6A893; --on-muscle:#1C0E0A;
    --fig:#62777E; --fig-far:#4A5E64; --fig-hi:#86A0A7; --ghost:#86A0A7;
    --stage:#101C1F; --grid:#1A2A2D; --floor:#2B3D41; --mat:#17262A; --prop:#33474C;
    --band:#71A9DC; --ball:#C7AC60; --ball-line:#94793A;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1517; --surface:#142024; --surface-2:#1A292D; --line:#263A3E;
  --ink:#E3ECEA; --muted:#97AAAD;
  --accent:#5DB5AA; --accent-ink:#08191A; --accent-soft:#1B3A37;
  --muscle:#EF8068; --muscle-soft:#3A231E; --muscle-ink:#F6A893; --on-muscle:#1C0E0A;
  --fig:#62777E; --fig-far:#4A5E64; --fig-hi:#86A0A7; --ghost:#86A0A7;
  --stage:#101C1F; --grid:#1A2A2D; --floor:#2B3D41; --mat:#17262A; --prop:#33474C;
  --band:#71A9DC; --ball:#C7AC60; --ball-line:#94793A;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:1380px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 36px;display:flex;flex-direction:column;gap:16px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:44px;height:44px;flex-shrink:0}
.mark-bg{fill:var(--accent)}
.mark-fg{fill:none;stroke:var(--accent-ink);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.mark-dot{fill:var(--accent-ink)}
h1{margin:0;font-family:var(--f-display);font-weight:600;font-size:clamp(1.25rem,1rem + 1.2vw,1.9rem);line-height:1.2;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:.9rem}
.today{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:.9rem;box-shadow:var(--shadow)}
.today-label{color:var(--muted)}
.today-num{font-weight:600;font-variant-numeric:tabular-nums}
.today-bar{width:80px;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:block}
.today-bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .5s}

/* exercise strip */
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scroll-snap-type:x proximity;scrollbar-width:thin}
.pill{flex:0 0 auto;scroll-snap-align:start;display:flex;align-items:center;gap:8px;min-height:46px;padding-block:6px;padding-inline:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:.92rem;white-space:nowrap;transition:background .2s,border-color .2s}
.pill:hover{border-color:var(--accent)}
.pill-n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-weight:600;font-size:.85rem;font-variant-numeric:tabular-nums;font-family:var(--f-display)}
.pill-ok{display:none;width:16px;height:16px;color:var(--accent)}
.pill.done .pill-ok{display:block}
.pill[aria-current="step"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill[aria-current="step"] .pill-n{background:var(--accent-ink);color:var(--accent)}
.pill[aria-current="step"] .pill-ok{color:var(--accent-ink)}

/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
@media (min-width:940px){
  .layout{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
  .stage-card{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
  .stage-head{display:none!important}
}

/* stage */
.stage-card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:12px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);min-width:0}
.stage-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:4px 6px 0}
.stage-head .sh-n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:600;font-family:var(--f-display);font-size:.9rem;flex-shrink:0}
.stage-head .sh-t{font-family:var(--f-display);font-weight:600;font-size:1.12rem}
.stage{position:relative;background:var(--stage);border-radius:18px;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none}
#fig{display:block;width:100%;height:auto;max-height:66vh}
#fig.swap{animation:swapIn .38s ease-out}
@keyframes swapIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.cue{position:absolute;top:12px;inset-inline-start:12px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);padding:6px 14px;border-radius:999px;font-weight:600;font-size:clamp(.88rem,.78rem + .45vw,1.1rem);box-shadow:var(--shadow);max-width:calc(100% - 24px)}
.cue-dot{width:9px;height:9px;border-radius:50%;background:var(--muscle);flex-shrink:0;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
.hold{position:absolute;top:58px;inset-inline-start:12px;display:flex;align-items:center;gap:8px;background:var(--muscle-soft);color:var(--muscle-ink);padding:4px 12px;border-radius:999px;font-size:.85rem;font-weight:600}
.hold-bar{width:64px;height:5px;border-radius:99px;background:var(--surface);overflow:hidden;display:block}
.hold-bar i{display:block;height:100%;width:0;background:var(--muscle)}
.view-chip{position:absolute;top:12px;inset-inline-end:12px;background:var(--surface);border:1px solid var(--line);color:var(--muted);padding:4px 12px;border-radius:999px;font-size:.8rem}
.cycle{position:absolute;bottom:0;inset-inline:0;height:4px}
.cycle i{display:block;height:100%;width:0;background:var(--accent);opacity:.55}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:0 6px;font-size:.84rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg-dot{width:11px;height:11px;border-radius:50%;background:var(--muscle);display:inline-block}
.lg-ghost{width:18px;height:11px;border-radius:6px;background:var(--ghost);opacity:.35;display:inline-block}
.lg-band{width:20px;height:0;border-top:3px dashed var(--band);display:inline-block}

.controls{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nav-btn{min-height:50px;padding-inline:16px 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);display:inline-flex;align-items:center;gap:6px;font-weight:600}
.nav-btn svg{width:20px;height:20px;flex-shrink:0}
.nav-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);padding-inline:18px 16px}
.mid{display:flex;align-items:center;gap:8px}
.icon-btn{width:50px;height:50px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center}
.icon-btn svg{width:22px;height:22px}
.chip-btn{min-height:44px;padding-inline:14px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:.86rem;color:var(--muted);font-weight:500}
@media (max-width:440px){
  .nav-btn span{display:none}
  .nav-btn,.nav-btn.primary{width:50px;padding:0;justify-content:center}
}

/* coaching panel */
.info{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:clamp(18px,2.4vw,28px);display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow);min-width:0}
.eyebrow{margin:0;color:var(--muted);font-size:.86rem;font-variant-numeric:tabular-nums}
h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:clamp(1.45rem,1.1rem + 1.3vw,2.15rem);line-height:1.2;text-wrap:balance}
.muscle{display:inline-flex;align-self:flex-start;align-items:center;gap:8px;background:var(--muscle-soft);color:var(--muscle-ink);padding:6px 14px;border-radius:999px;font-weight:600;font-size:.95rem}
.muscle i{width:10px;height:10px;border-radius:50%;background:var(--muscle);display:inline-block}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;color:var(--muted);transition:background .3s,color .3s}
.steps li::before{content:counter(s);flex-shrink:0;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-family:var(--f-display);font-weight:600;font-size:.85rem;transition:background .3s,color .3s}
.steps li.on{background:var(--accent-soft);color:var(--ink);font-weight:500}
.steps li.on::before{background:var(--accent);color:var(--accent-ink)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:.86rem;font-weight:500}
.tag svg{width:16px;height:16px;flex-shrink:0;color:var(--accent)}

/* tool */
.tool{border-top:1px solid var(--line);padding-top:18px;display:flex;flex-direction:column;gap:14px}
.tool-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.tool-head h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:1.08rem}
.tool-head span{color:var(--muted);font-size:.84rem}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface-2);padding:4px;border-radius:14px}
.seg-btn{min-height:46px;border:0;border-radius:10px;background:transparent;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
.seg-btn[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg-n{font-variant-numeric:tabular-nums;font-size:.8rem;background:var(--accent-soft);color:var(--accent);padding:1px 9px;border-radius:99px}
.tool-main{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ring{width:132px;height:132px;position:relative;flex-shrink:0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--surface-2)}
.ring .val{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .3s}
.ring.full .val{stroke:var(--muscle)}
.ring-txt{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.15}
.ring-txt b{font-family:var(--f-display);font-size:2.1rem;font-weight:600;font-variant-numeric:tabular-nums}
.ring-txt span{font-size:.8rem;color:var(--muted)}
.tool-actions{flex:1;min-width:190px;display:flex;flex-direction:column;gap:10px}
.big-btn{min-height:58px;border-radius:16px;border:0;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:600;font-size:1.12rem;transition:transform .1s}
.big-btn:active{transform:scale(.97)}
.big-btn.stop{background:var(--muscle);color:var(--on-muscle)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.soft-btn{min-height:44px;padding-inline:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-weight:600;font-variant-numeric:tabular-nums}
.soft-btn.armed{background:var(--muscle-soft);color:var(--muscle-ink);border-color:var(--muscle)}
.goal-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:12px;padding:3px}
.stepper button{width:44px;height:40px;border:0;border-radius:9px;background:var(--surface);font-weight:700;font-size:1.1rem}
.stepper b{min-width:44px;text-align:center;color:var(--ink);font-variant-numeric:tabular-nums}
.clock{font-family:var(--f-display);font-size:3.2rem;font-weight:600;font-variant-numeric:tabular-nums;min-width:132px;text-align:center;line-height:1}
.tool-stat{margin:0;color:var(--muted);font-size:.9rem}
.tool-stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.status{margin:0;min-height:1.5em;font-size:.9rem;color:var(--accent);font-weight:500}
.safety{margin:0;display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:.86rem;background:var(--surface-2);padding:12px 14px;border-radius:14px}
.safety svg{width:18px;height:18px;flex-shrink:0;margin-top:2px;color:var(--accent)}
.kbd-hint{margin:0;color:var(--muted);font-size:.8rem;text-align:center}
@media (hover:none){.kbd-hint{display:none}}

/* mannequin */
#fig .dot{fill:var(--grid)}
.limb,.sheen,.mus,.glow,.band,.arrow,.prop,.floor,.gh{fill:none;stroke-linecap:round;stroke-linejoin:round}
.limb.near,.limb.torso{stroke:var(--fig)}
.limb.far{stroke:var(--fig-far)}
.sheen{stroke:var(--fig-hi);opacity:.6}
.sheen.far{opacity:.28}
.head{fill:var(--fig)}
.head-hi{fill:var(--fig-hi);opacity:.55}
.mus,.glow{stroke:var(--muscle)}
.band{stroke:var(--band);stroke-dasharray:9 6}
.arrow{stroke:var(--accent)}
.ball{fill:var(--ball);stroke:var(--ball-line);stroke-width:2}
.ball-hi{fill:var(--surface);opacity:.5}
.shadow{fill:var(--floor);opacity:.6}
.floor{stroke:var(--floor)}
.prop{stroke:var(--prop)}
.mat{fill:var(--mat)}
.wall{fill:var(--prop)}
#gGhost{opacity:.2}
.gh{stroke:var(--ghost)}
.ghh{fill:var(--ghost)}

@media (prefers-reduced-motion: reduce){
  #fig.swap{animation:none}
  .cue-dot{animation:none}
  .today-bar i,.ring .val,.steps li,.steps li::before{transition:none}
}
</style>
<style>
html{-webkit-text-size-adjust:100%;color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="app" dir="rtl" lang="ar">
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 44 44" aria-hidden="true"><rect class="mark-bg" width="44" height="44" rx="12"></rect><circle class="mark-dot" cx="11" cy="29" r="3.8"></circle><path class="mark-fg" d="M16 30 L25 23 L28 32 M25 23 L33 17"></path></svg>
      <div>
        <h1>تمارين العلاج الطبيعي</h1>
        <p class="sub">برنامج يومي · 8 تمارين · 100 تكرار</p>
      </div>
    </div>
    <div class="today" aria-live="polite">
      <span class="today-label">إنجاز اليوم</span>
      <span class="today-num"><span id="doneCount">0</span> من 8</span>
      <span class="today-bar"><i id="doneBar"></i></span>
    </div>
  </header>

  <nav class="strip" id="strip" aria-label="قائمة التمارين"></nav>

  <main class="layout">
    <section class="stage-card" aria-label="العرض المتحرك">
      <div class="stage-head"><span class="sh-n" id="shNum">1</span><span class="sh-t" id="shTitle"></span></div>
      <div class="stage" id="stage">
        <svg id="fig" viewBox="0 0 400 250" role="img" aria-label="">
          <defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle class="dot" cx="2" cy="2" r="1.1"></circle></pattern></defs>
          <rect width="400" height="250" fill="url(#dots)"></rect>
          <g id="gBack"></g>
          <g id="gGhost"></g>
          <g id="gFig"></g>
        </svg>
        <div class="cue"><span class="cue-dot"></span><span id="cueText">استعد</span></div>
        <div class="hold" id="hold" hidden><span>اثبت</span><span class="hold-bar"><i id="holdBar"></i></span></div>
        <div class="view-chip" id="viewChip" hidden>منظر من الأعلى</div>
        <div class="cycle"><i id="cycleBar"></i></div>
      </div>
      <div class="legend">
        <span><i class="lg-dot"></i><span id="lgMuscle">العضلة المستهدفة</span></span>
        <span><i class="lg-ghost"></i>الوضعية المطلوبة</span>
        <span id="lgBand" hidden><i class="lg-band"></i>شريط المقاومة</span>
      </div>
      <div class="controls">
        <button type="button" class="nav-btn" id="prev" aria-label="التمرين السابق"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg><span>السابق</span></button>
        <div class="mid">
          <button type="button" class="icon-btn" id="play" aria-label="إيقاف الحركة مؤقتاً"></button>
          <button type="button" class="chip-btn" id="speed">السرعة: عادية</button>
        </div>
        <button type="button" class="nav-btn primary" id="next" aria-label="التمرين التالي"><span>التالي</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
      </div>
      <p class="kbd-hint">تنقّل بالأسهم ← → في لوحة المفاتيح</p>
    </section>

    <section class="info" aria-live="polite">
      <p class="eyebrow">تمرين <span id="exNum">1</span> من 8</p>
      <h2 id="exTitle"></h2>
      <div class="muscle"><i></i><span id="exMuscle"></span></div>
      <ol class="steps" id="steps"></ol>
      <div class="tags" id="tags"></div>
      <div class="tool" id="tool"></div>
      <p class="safety"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5"></path><path d="M12 8h.01"></path></svg><span>تحرّك ببطء، وتوقّف عند الشعور بألم حاد واستشر أخصائي العلاج.</span></p>
    </section>
  </main>
</div>

<script>
(function(){
  'use strict';
  document.documentElement.setAttribute('dir','rtl');
  document.documentElement.setAttribute('lang','ar');

  /* ---------- geometry helpers ---------- */
  var D = Math.PI/180;

  function curSide(ex){ return ex.sides ? (store.side[ex.id]==='L'?'L':'R') : 'C'; }
  function rec(ex){ return store.d[ex.id]||(store.d[ex.id]={}); }
  function getN(ex,s){ var r=rec(ex)[s]; if(ex.tool==='hold') return (r&&typeof r==='object')?r:{best:0,n:0}; return typeof r==='number'?r:0; }
  function isDone(ex){ return sidesOf(ex).every(function(s){ if(ex.tool==='reps') return getN(ex,s)>=store.goal; if(ex.tool==='hold') return getN(ex,s).n>=1; return getN(ex,s)>=1; }); }
  function fmt(sec){ sec=Math.max(0,Math.floor(sec)); return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'); }
  function sideSum(ex,s){ if(ex.tool==='hold'){ var v=getN(ex,s); return v.n?fmt(v.best):'—'; } return getN(ex,s); }

  /* ---------- DOM ---------- */
  var $=function(id){ return document.getElementById(id); };
  var fig=$('fig'), gBack=$('gBack'), gGhost=$('gGhost'), gFig=$('gFig');
  var NS='http://www.w3.org/2000/svg';
  var reduced=false; try{ reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
  var cur=0, playing=!reduced, speed=1, clock=0, last=null, els=[], lastLabel='', lastCue=-1, lastHold=null;
  var timer=null, statusMsg='', resetArmed=false, resetT=null;

  function svgStr(it){
    if(it.t==='path') return '<path class="'+it.cls+'" d="M'+it.pts.map(fp).join(' L')+(it.extra||'')+'" stroke-width="'+it.w+'"></path>';
    if(it.t==='rect') return '<rect class="'+it.cls+'" x="'+it.x+'" y="'+it.y+'" width="'+it.w+'" height="'+it.h+'" rx="'+it.rx+'"></rect>';
    if(it.t==='circle') return '<circle class="'+it.cls+'" cx="'+it.x+'" cy="'+it.y+'" r="'+it.r+'"></circle>';
    return '';
  }
  function apply(e,it){
    if(e.getAttribute('class')!==it.cls) e.setAttribute('class',it.cls);
    if(it.t==='path'){
      e.setAttribute('d','M'+it.pts.map(fp).join(' L')+(it.extra||''));
      e.setAttribute('stroke-width',it.w.toFixed(2));
      if(it.dx!=null) e.setAttribute('transform','translate('+it.dx+' '+it.dy+')');
    } else if(it.t==='circle'){ e.setAttribute('cx',it.x.toFixed(1)); e.setAttribute('cy',it.y.toFixed(1)); e.setAttribute('r',it.r.toFixed(1)); }
    else if(it.t==='ellipse'){ e.setAttribute('cx',it.x.toFixed(1)); e.setAttribute('cy',it.y.toFixed(1)); e.setAttribute('rx',it.rx.toFixed(1)); e.setAttribute('ry',it.ry.toFixed(1)); }
    else if(it.t==='rect'){ e.setAttribute('x',it.x); e.setAttribute('y',it.y); e.setAttribute('width',it.w); e.setAttribute('height',it.h); e.setAttribute('rx',it.rx); }
    if(it.o!=null) e.setAttribute('opacity',it.o.toFixed(3));
  }
  function render(items){
    var rebuild=els.length!==items.length;
    if(!rebuild){ for(var j=0;j<items.length;j++){ if(els[j].tagName!==items[j].t){ rebuild=true; break; } } }
    if(rebuild){ gFig.textContent=''; els=items.map(function(it){ var e=document.createElementNS(NS,it.t); gFig.appendChild(e); return e; }); }
    for(var k=0;k<items.length;k++) apply(els[k],items[k]);
  }

  function ease(x){ return 0.5-0.5*Math.cos(Math.PI*x); }
  function sample(ex,t){
    var n=ex.kfs.length, i=0;
    while(i<n-1 && t>=ex.kfs[i+1].start) i++;
    var k=ex.kfs[i], prev=ex.kfs[(i-1+n)%n], lt=t-k.start, u, ph;
    if(lt<k.d){ u=ease(lt/k.d); ph='move'; } else { u=1; ph='hold'; }
    var p={}; for(var key in k.p) p[key]=lerp(prev.p[key],k.p[key],u);
    return {p:p,k:k,ph:ph,hf:k.h?Math.min(1,Math.max(0,(lt-k.d)/k.h)):0};
  }
  function peakTime(ex){ var k=ex.kfs[ex.ghost]; return k.start+k.d+Math.min(400,k.h/2); }

  function draw(){
    var ex=EX[cur], t=clock%ex.total, s=sample(ex,t);
    render(ex.build(s.p).i);
    if(s.k.label!==lastLabel){ lastLabel=s.k.label; $('cueText').textContent=lastLabel; }
    if(s.k.cue!==lastCue){ lastCue=s.k.cue; var lis=$('steps').children; for(var i=0;i<lis.length;i++) lis[i].classList.toggle('on',i===lastCue); }
    var showHold=!!(s.k.hold && s.ph==='hold');
    if(showHold!==lastHold){ lastHold=showHold; $('hold').hidden=!showHold; }
    if(showHold) $('holdBar').style.width=(s.hf*100).toFixed(1)+'%';
    $('cycleBar').style.width=(t/ex.total*100).toFixed(2)+'%';
  }
  function frame(ts){
    if(last==null) last=ts;
    var dt=Math.min(64,ts-last); last=ts;
    if(playing){ clock+=dt*speed; draw(); }
    requestAnimationFrame(frame);
  }

  /* ---------- info panel ---------- */
  function renderInfo(){
    var ex=EX[cur];
    $('exNum').textContent=ex.id; $('shNum').textContent=ex.id;
    $('exTitle').textContent=ex.name; $('shTitle').textContent=ex.name;
    $('exMuscle').textContent=ex.muscle; $('lgMuscle').textContent=ex.muscle;
    $('lgBand').hidden=!ex.band;
    $('viewChip').hidden=!ex.top;
    fig.setAttribute('aria-label','مجسم متحرك يوضح تمرين '+ex.name+'، والعضلة المستهدفة: '+ex.muscle);
    $('steps').innerHTML=ex.steps.map(function(s){ return '<li>'+s+'</li>'; }).join('');
    $('tags').innerHTML=ex.tags.map(function(t){ return '<span class="tag">'+icon(TAGS[t][1])+TAGS[t][0]+'</span>'; }).join('');
    lastCue=-1; lastLabel=''; lastHold=null;
    renderTool();
  }
  function renderStrip(){
    $('strip').innerHTML=EX.map(function(ex,i){
      return '<button type="button" class="pill'+(isDone(ex)?' done':'')+'" data-i="'+i+'"'+(i===cur?' aria-current="step"':'')+'><span class="pill-n">'+ex.id+'</span><span>'+ex.short+'</span><svg class="pill-ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-label="مكتمل"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>';
    }).join('');
    var a=$('strip').querySelector('[aria-current]');
    if(a && a.scrollIntoView){ try{ a.scrollIntoView({block:'nearest',inline:'nearest',behavior:reduced?'auto':'smooth'}); }catch(e){} }
  }
  function updateProgress(){
    var n=EX.filter(isDone).length;
    $('doneCount').textContent=n; $('doneBar').style.width=(n/EX.length*100)+'%';
    var pills=$('strip').children;
    for(var i=0;i<pills.length;i++) pills[i].classList.toggle('done',isDone(EX[i]));
  }

  var C=2*Math.PI*52;
  function ring(frac,big,small){
    frac=Math.max(0,Math.min(1,frac));
    return '<div class="ring'+(frac>=1?' full':'')+'"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="track" cx="60" cy="60" r="52" fill="none" stroke-width="10"></circle><circle class="val" id="ringVal" cx="60" cy="60" r="52" fill="none" stroke-width="10" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-frac)).toFixed(1)+'"></circle></svg><div class="ring-txt"><b id="ringBig">'+big+'</b><span>'+small+'</span></div></div>';
  }
  function resetBtn(){ return '<button type="button" class="soft-btn reset'+(resetArmed?' armed':'')+'" data-act="reset">'+(resetArmed?'اضغط للتأكيد':'تصفير')+'</button>'; }
  function renderTool(){
    var ex=EX[cur], s=curSide(ex), h='';
    var run=timer && timer.ex===ex.id;
    var title={reps:'عدّاد التكرار',hold:'مؤقّت الثبات',timed:'مؤقّت 30 ثانية'}[ex.tool];
    h+='<div class="tool-head"><h3>'+title+'</h3><span>يُحفظ لليوم على هذا الجهاز</span></div>';
    if(ex.sides){
      h+='<div class="seg" role="group" aria-label="اختر الرجل">'+['R','L'].map(function(x){
        return '<button type="button" class="seg-btn" data-act="side" data-side="'+x+'" aria-pressed="'+(x===s)+'">'+(x==='R'?'اليمنى':'اليسرى')+'<span class="seg-n">'+sideSum(ex,x)+'</span></button>';
      }).join('')+'</div>';
    }
    if(ex.tool==='reps'){
      var n=getN(ex,s);
      h+='<div class="tool-main">'+ring(n/store.goal,n,'من '+store.goal)+'<div class="tool-actions"><button type="button" class="big-btn" data-act="plus" data-v="1">+1 تكرار</button><div class="row"><button type="button" class="soft-btn" data-act="plus" data-v="10">+10</button><button type="button" class="soft-btn" data-act="plus" data-v="-1" aria-label="إنقاص تكرار واحد">−1</button>'+resetBtn()+'</div></div></div>';
      h+='<div class="goal-row"><span>الهدف اليومي'+(ex.sides?' لكل رجل':'')+'</span><div class="stepper"><button type="button" data-act="goal" data-v="-10" aria-label="تقليل الهدف">−</button><b>'+store.goal+'</b><button type="button" data-act="goal" data-v="10" aria-label="زيادة الهدف">+</button></div></div>';
    } else if(ex.tool==='hold'){
      var v=getN(ex,s);
      h+='<div class="tool-main"><div class="clock" id="clock">'+(run?fmt((performance.now()-timer.t0)/1000):'0:00')+'</div><div class="tool-actions"><button type="button" class="big-btn'+(run?' stop':'')+'" data-act="hold">'+(run?'إيقاف وتسجيل':'ابدأ الثبات')+'</button><div class="row" style="align-items:center"><p class="tool-stat">أفضل وقت اليوم <b>'+(v.n?fmt(v.best):'—')+'</b> · المرات <b>'+v.n+'</b></p>'+resetBtn()+'</div></div></div>';
    } else {
      var c=getN(ex,s), left=run?Math.max(0,30-(performance.now()-timer.t0)/1000):30;
      h+='<div class="tool-main">'+ring(run?(30-left)/30:0,Math.ceil(left),'ثانية')+'<div class="tool-actions"><button type="button" class="big-btn'+(run?' stop':'')+'" data-act="cd">'+(run?'إيقاف':'ابدأ 30 ثانية')+'</button><div class="row" style="align-items:center"><p class="tool-stat">مرات الثبات اليوم <b>'+c+'</b></p>'+resetBtn()+'</div></div></div>';
    }
    h+='<p class="status" role="status">'+statusMsg+'</p>';
    $('tool').innerHTML=h;
  }

  function stopTimer(record){
    if(!timer) return;
    var ex=EX.filter(function(e){ return e.id===timer.ex; })[0], sec=(performance.now()-timer.t0)/1000;
    if(record && ex.tool==='hold' && sec>=1){
      var r=rec(ex), v=getN(ex,timer.side); v={best:Math.max(v.best,Math.floor(sec)),n:v.n+1}; r[timer.side]=v; save();
      statusMsg='سُجّل الثبات: '+fmt(sec);
    }
    timer=null;
  }
  setInterval(function(){
    if(!timer) return;
    var ex=EX[cur]; if(ex.id!==timer.ex) return;
    var sec=(performance.now()-timer.t0)/1000;
    if(ex.tool==='hold'){ var c=$('clock'); if(c) c.textContent=fmt(sec); }
    else {
      if(sec>=30){
        var r=rec(ex); r[timer.side]=getN(ex,timer.side)+1; save(); timer=null;
        statusMsg='أحسنت، اكتملت 30 ثانية.';
        try{ if(navigator.vibrate) navigator.vibrate(200); }catch(e){}
        renderTool(); updateProgress(); return;
      }
      var left=30-sec, b=$('ringBig'), rv=$('ringVal');
      if(b) b.textContent=Math.ceil(left);
      if(rv) rv.setAttribute('stroke-dashoffset',(C*(left/30)).toFixed(1));
    }
  },200);

  $('tool').addEventListener('click',function(ev){
    var b=ev.target.closest('button[data-act]'); if(!b) return;
    var ex=EX[cur], s=curSide(ex), act=b.getAttribute('data-act');
    if(act!=='reset'){ resetArmed=false; clearTimeout(resetT); }
    if(act==='side'){ var ns=b.getAttribute('data-side'); if(ns!==s){ if(timer) stopTimer(true); store.side[ex.id]=ns; save(); } statusMsg=''; }
    else if(act==='plus'){ var r=rec(ex); r[s]=Math.max(0,getN(ex,s)+Number(b.getAttribute('data-v'))); save(); statusMsg=(r[s]===store.goal&&Number(b.getAttribute('data-v'))>0)?'أحسنت، وصلت للهدف.':''; }
    else if(act==='goal'){ store.goal=Math.min(500,Math.max(10,store.goal+Number(b.getAttribute('data-v')))); save(); statusMsg=''; }
    else if(act==='reset'){
      if(!resetArmed){ resetArmed=true; clearTimeout(resetT); resetT=setTimeout(function(){ resetArmed=false; renderTool(); },3500); }
      else { resetArmed=false; clearTimeout(resetT); if(timer&&timer.ex===ex.id) timer=null; var rr=rec(ex); delete rr[s]; save(); statusMsg='تم التصفير.'; }
    }
    else if(act==='hold'){ if(timer&&timer.ex===ex.id) stopTimer(true); else { timer={ex:ex.id,side:s,t0:performance.now()}; statusMsg=''; } }
    else if(act==='cd'){ if(timer&&timer.ex===ex.id){ stopTimer(false); statusMsg='أُوقف المؤقت.'; } else { timer={ex:ex.id,side:s,t0:performance.now()}; statusMsg=''; } }
    renderTool(); updateProgress();
    var again=$('tool').querySelector('button[data-act="'+act+'"]'+(act==='side'?'[data-side="'+b.getAttribute('data-side')+'"]':(b.getAttribute('data-v')?'[data-v="'+b.getAttribute('data-v')+'"]':'')));
    if(again) again.focus({preventScroll:true});
  });

  /* ---------- navigation ---------- */
  function setEx(i,fromHash){
    i=(i+EX.length)%EX.length;
    if(timer) stopTimer(true);
    cur=i; statusMsg=''; resetArmed=false;
    var ex=EX[cur];
    clock=playing?0:peakTime(ex);
    [gBack,gGhost,gFig].forEach(function(g){ if(ex.tf) g.setAttribute('transform',ex.tf); else g.removeAttribute('transform'); });
    var bs=new Sc(); ex.back(bs); gBack.innerHTML=bs.i.map(svgStr).join('');
    var gh=ex.build(ex.kfs[ex.ghost].p).i, out='';
    gh.forEach(function(it){
      if(it.t==='path' && it.cls.indexOf('limb')===0) out+='<path class="gh" d="M'+it.pts.map(fp).join(' L')+'" stroke-width="'+it.w+'"></path>';
      else if(it.t==='circle' && it.cls==='head') out+='<circle class="ghh" cx="'+it.x+'" cy="'+it.y+'" r="'+it.r+'"></circle>';
    });
    gGhost.innerHTML=out;
    gFig.textContent=''; els=[];
    renderInfo(); renderStrip(); updateProgress();
    if(!reduced){ fig.classList.remove('swap'); void fig.getBBox; fig.offsetWidth; fig.classList.add('swap'); }
    draw();
    if(!fromHash){ try{ history.replaceState(null,'','#ex-'+ex.id); }catch(e){} }
  }
  $('strip').addEventListener('click',function(ev){ var b=ev.target.closest('.pill'); if(b) setEx(Number(b.getAttribute('data-i'))); });
  $('prev').addEventListener('click',function(){ setEx(cur-1); });
  $('next').addEventListener('click',function(){ setEx(cur+1); });

  var PLAY='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>';
  var PAUSE='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6.5" y="5" width="3.6" height="14" rx="1"/><rect x="13.9" y="5" width="3.6" height="14" rx="1"/></svg>';
  function syncPlay(){ $('play').innerHTML=playing?PAUSE:PLAY; $('play').setAttribute('aria-label',playing?'إيقاف الحركة مؤقتاً':'تشغيل الحركة'); }
  $('play').addEventListener('click',function(){ playing=!playing; syncPlay(); if(!playing) draw(); });
  $('speed').addEventListener('click',function(){ speed=speed===1?0.55:1; $('speed').textContent='السرعة: '+(speed===1?'عادية':'بطيئة'); });

  var sx=null, sy=null;
  $('stage').addEventListener('pointerdown',function(e){ sx=e.clientX; sy=e.clientY; });
  $('stage').addEventListener('pointerup',function(e){
    if(sx==null) return; var dx=e.clientX-sx, dy=e.clientY-sy; sx=null;
    if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.3) setEx(dx>0?cur+1:cur-1);
  });
  $('stage').addEventListener('pointercancel',function(){ sx=null; });
  document.addEventListener('keydown',function(e){
    if(e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if(e.key==='ArrowLeft'){ e.preventDefault(); setEx(cur+1); }
    else if(e.key==='ArrowRight'){ e.preventDefault(); setEx(cur-1); }
  });
  function fromHash(){ var m=/^#ex-([1-8])$/.exec(location.hash||''); return m?Number(m[1])-1:null; }
  window.addEventListener('hashchange',function(){ var h=fromHash(); if(h!=null && h!==cur) setEx(h,true); });

  /* keep the screen awake while exercising, where allowed */
  var wl=null;
  function lock(){ try{ if(!wl && navigator.wakeLock && document.visibilityState==='visible'){ navigator.wakeLock.request('screen').then(function(l){ wl=l; l.addEventListener('release',function(){ wl=null; }); }).catch(function(){}); } }catch(e){} }
  document.addEventListener('pointerdown',lock);
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible'){ lock(); if(store.date!==today()){ store=load(); renderTool(); updateProgress(); } }
  });

  syncPlay();
  var start=fromHash();
  setEx(start==null?0:start,true);
  requestAnimationFrame(frame);
})();
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});}
</script>
</body>
