<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="تمارين العلاج الطبيعي — استوديو ثلاثي الأبعاد تفاعلي بخلفية سادة نقية بدون ظلال مع عدّاد تكرار ومؤقّت.">
<meta name="theme-color" content="#161A1E" id="metaTheme">
<title>تمارين العلاج الطبيعي</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* ==========================================================================
   DESIGN TOKENS — Minimalist Apple HIG-Inspired Clinical Studio
   Solid Flat 3D Stage, Zero Shadows, Zero Grids, Zero Audio, Zero Arrows
   ========================================================================== */
:root,
:root[data-theme="dark"] {
  --bg: #161A1E;
  --stage-bg: #161A1E;
  --surface: #20242A;
  --surface-2: #272E36;
  --surface-3: #303944;
  --glass: rgba(32, 36, 42, 0.84);
  --glass-strong: rgba(32, 36, 42, 0.95);
  --line: #2D3640;
  --line-subtle: rgba(232, 238, 242, 0.085);
  --line-strong: rgba(232, 238, 242, 0.16);
  --ink: #E8EEF2;
  --muted: #92A3B0;

  --accent: #4FB3A8;
  --accent-hover: #62C4B9;
  --accent-ink: #071918;
  --accent-soft: #2B3D4E;
  --accent-tint: rgba(79, 179, 168, 0.16);
  --accent-glow: rgba(79, 179, 168, 0.28);

  --muscle: #EF755D;
  --muscle-soft: rgba(239, 117, 93, 0.17);
  --muscle-ink: #FFB4A5;
  --on-muscle: #220A05;

  --scrim: rgba(7, 10, 14, 0.68);
  --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.24);
  --shadow: 0 10px 28px rgba(0, 0, 0, 0.30);
  --shadow-lg: 0 24px 56px rgba(0, 0, 0, 0.48);

  --f-display: 'Readex Pro', 'IBM Plex Sans Arabic', system-ui, sans-serif;
  --f-body: 'IBM Plex Sans Arabic', 'Readex Pro', system-ui, sans-serif;
  color-scheme: dark;
}

:root[data-theme="light"] {
  --bg: #EEF2F4;
  --stage-bg: #EEF2F4;
  --surface: #FFFFFF;
  --surface-2: #E4EBEF;
  --surface-3: #D4DFE5;
  --glass: rgba(255, 255, 255, 0.88);
  --glass-strong: rgba(255, 255, 255, 0.96);
  --line: #D2DCE2;
  --line-subtle: rgba(23, 36, 44, 0.10);
  --line-strong: rgba(23, 36, 44, 0.20);
  --ink: #17242C;
  --muted: #556773;

  --accent: #1B6B65;
  --accent-hover: #145651;
  --accent-ink: #FFFFFF;
  --accent-soft: #D7EAE7;
  --accent-tint: rgba(27, 107, 101, 0.12);
  --accent-glow: rgba(27, 107, 101, 0.22);

  --muscle: #E0462B;
  --muscle-soft: rgba(224, 70, 43, 0.14);
  --muscle-ink: #A32F1A;
  --on-muscle: #FFFFFF;

  --scrim: rgba(15, 24, 30, 0.44);
  --shadow-sm: 0 1px 3px rgba(23, 36, 44, 0.06);
  --shadow: 0 8px 24px rgba(23, 36, 44, 0.08);
  --shadow-lg: 0 22px 52px rgba(23, 36, 44, 0.16);
  color-scheme: light;
}

/* ==========================================================================
   BASE & STRICT SINGLE-SCREEN SHELL (100dvh, NO PAGE SCROLL)
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  -webkit-text-size-adjust: 100%;
}
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  transition: background-color 0.24s ease, color 0.24s ease;
}
button {
  font: inherit;
  color: inherit;
  cursor: pointer;
  border: 0;
  background: none;
  padding: 0;
}
button:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.shell {
  height: 100%;
  max-width: 1340px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-top: max(10px, env(safe-area-inset-top, 0px));
  padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
  padding-inline: max(14px, env(safe-area-inset-left, 0px)) max(14px, env(safe-area-inset-right, 0px));
}

/* ==========================================================================
   HEADER & 8-SEGMENT PROGRESS BAR
   ========================================================================== */
.hdr { display: flex; flex-direction: column; gap: 7px; flex-shrink: 0; }
.bar { display: flex; align-items: center; gap: 8px; }

.ibtn {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--surface);
  display: grid;
  place-items: center;
  flex-shrink: 0;
  box-shadow: var(--shadow-sm);
  transition: background 0.16s, border-color 0.16s, transform 0.12s;
}
.ibtn:hover { background: var(--surface-2); }
.ibtn:active { transform: scale(0.95); }
.ibtn svg { width: 20px; height: 20px; }

.bar-t { flex: 1; min-width: 0; line-height: 1.22; }
.bar-t small {
  display: block;
  color: var(--muted);
  font-size: 0.78rem;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}
.bar-t h1 {
  margin: 1px 0 0;
  font-family: var(--f-display);
  font-weight: 600;
  font-size: clamp(1.06rem, 0.94rem + 0.65vw, 1.44rem);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.daychip {
  display: none;
  align-items: center;
  gap: 7px;
  padding: 8px 14px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  font-size: 0.84rem;
  color: var(--muted);
  white-space: nowrap;
  box-shadow: var(--shadow-sm);
}
.daychip b {
  color: var(--ink);
  font-family: var(--f-display);
  font-variant-numeric: tabular-nums;
}
@media (min-width: 640px) { .daychip { display: inline-flex; } }

.segs { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 5px; }
.seg-b { height: 16px; display: flex; align-items: center; }
.seg-b i {
  display: block;
  width: 100%;
  height: 4.5px;
  border-radius: 99px;
  background: var(--surface-3);
  transition: background 0.24s, box-shadow 0.24s, transform 0.16s, height 0.18s;
}
.seg-b:hover i { transform: scaleY(1.35); }
.seg-b.done i { background: var(--accent-soft); }
.seg-b[aria-current="step"] i {
  background: var(--accent);
  height: 5.5px;
  box-shadow: 0 0 12px var(--accent-glow);
}

/* ==========================================================================
   MAIN WORKSPACE & SOLID FLAT 3D WEBGL STAGE (SHADOWLESS)
   ========================================================================== */
.main {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 12px;
}
.col {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 0;
  min-width: 0;
}

.stage {
  flex: 1;
  min-height: 180px;
  position: relative;
  border-radius: 24px;
  border: 1px solid var(--line);
  overflow: hidden;
  background-color: var(--stage-bg);
  background-image: none;
  box-shadow: var(--shadow);
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}

#glCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  cursor: grab;
  touch-action: none;
}
#glCanvas:active { cursor: grabbing; }

.webgl-fallback {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  text-align: center;
  padding: 24px;
  color: var(--muted);
  font-size: 0.94rem;
}

/* Stage Overlay Pills */
.hold {
  position: absolute;
  top: 12px;
  inset-inline-start: 12px;
  display: flex;
  align-items: center;
  gap: 9px;
  background: var(--muscle-soft);
  color: var(--muscle-ink);
  border: 1px solid rgba(239, 117, 93, 0.36);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  padding: 5px 13px;
  border-radius: 999px;
  font-size: 0.82rem;
  font-weight: 700;
  box-shadow: var(--shadow-sm);
  z-index: 4;
  pointer-events: none;
}
.hold-bar { width: 56px; height: 5px; border-radius: 99px; background: var(--glass-strong); overflow: hidden; display: block; }
.hold-bar i { display: block; height: 100%; width: 0; background: var(--muscle); border-radius: 99px; }

.cam-dock {
  position: absolute;
  top: 12px;
  inset-inline-end: 12px;
  display: flex;
  align-items: center;
  z-index: 4;
  max-width: calc(100% - 24px);
}
.cam-pills {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border-radius: 999px;
  background: var(--glass);
  border: 1px solid var(--line);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: var(--shadow-sm);
}
.cam-btn {
  height: 30px;
  padding-inline: 11px;
  border-radius: 999px;
  font-size: 0.77rem;
  font-weight: 600;
  color: var(--muted);
  white-space: nowrap;
  transition: background 0.16s, color 0.16s;
}
.cam-btn:hover { color: var(--ink); }
.view-btn {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--ink);
  background: var(--glass);
  border: 1px solid var(--line);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: var(--shadow-sm);
  transition: background 0.16s, color 0.16s, transform 0.16s;
}
.view-btn svg { width: 22px; height: 22px; }
.view-btn:hover { background: var(--glass-strong); }
.view-btn:active { transform: scale(0.94); }
.view-btn.free { color: var(--accent); border-color: var(--accent); }
.switch {
  position: relative;
  width: 52px;
  height: 32px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface-3);
  flex-shrink: 0;
  transition: background 0.18s, border-color 0.18s;
}
.switch i {
  position: absolute;
  top: 3px;
  inset-inline-start: 3px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--ink);
  transition: inset-inline-start 0.18s;
}
.switch[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.switch[aria-checked="true"] i { inset-inline-start: 23px; background: var(--accent-ink); }
.cam-btn[aria-pressed="true"] {
  background: var(--accent);
  color: var(--accent-ink);
}
@media (max-width: 520px) {
  .cam-btn { padding-inline: 9px; font-size: 0.73rem; height: 28px; }
}

.mchip {
  position: absolute;
  bottom: 24px;
  inset-inline-start: 12px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  max-width: calc(100% - 24px);
  background: var(--glass);
  border: 1px solid var(--line);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  padding: 5px 13px;
  border-radius: 999px;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--muscle-ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  box-shadow: var(--shadow-sm);
  z-index: 4;
  pointer-events: none;
}
.mchip i {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--muscle);
  box-shadow: 0 0 8px var(--muscle);
  flex-shrink: 0;
  animation: coralPulse 1.8s ease-in-out infinite;
}
@keyframes coralPulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(0.76); opacity: 0.52; }
}

.toast {
  position: absolute;
  bottom: 62px;
  left: 50%;
  transform: translate(-50%, 8px);
  background: var(--ink);
  color: var(--bg);
  padding: 8px 18px;
  border-radius: 999px;
  font-size: 0.85rem;
  font-weight: 700;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s, transform 0.25s;
  white-space: nowrap;
  max-width: calc(100% - 28px);
  overflow: hidden;
  text-overflow: ellipsis;
  z-index: 6;
  box-shadow: var(--shadow-lg);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Interactive Silent Timeline Scrubber with Coral Hold Segment */
.scrubber {
  position: absolute;
  bottom: 0;
  inset-inline: 0;
  height: 24px;
  display: flex;
  align-items: flex-end;
  padding: 0 14px 8px;
  cursor: pointer;
  touch-action: none;
  z-index: 5;
  direction: ltr;
}
.scrub-track {
  position: relative;
  width: 100%;
  height: 4px;
  border-radius: 99px;
  background: var(--line-strong);
  transition: height 0.14s ease;
}
.scrubber:hover .scrub-track,
.scrubber.dragging .scrub-track { height: 6px; }

.scrub-hold {
  position: absolute;
  top: 0;
  height: 100%;
  border-radius: 99px;
  background: var(--muscle);
  opacity: 0.54;
  pointer-events: none;
}
.scrub-fill {
  position: absolute;
  top: 0;
  left: 0;
  height: 100%;
  width: 0;
  border-radius: 99px;
  background: var(--accent);
}
.scrub-thumb {
  position: absolute;
  top: 50%;
  left: 0;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid var(--surface);
  box-shadow: 0 0 10px var(--accent-glow);
  transform: translate(-50%, -50%) scale(0.78);
  opacity: 0.94;
  transition: transform 0.14s ease, opacity 0.14s ease;
}
.scrubber:hover .scrub-thumb,
.scrubber.dragging .scrub-thumb {
  transform: translate(-50%, -50%) scale(1.22);
  opacity: 1;
}

/* ==========================================================================
   DIRECTLY BELOW 3D STAGE: COUNTER/TIMER DOCK & BOTTOM NAVIGATION ONLY
   ========================================================================== */
.dock-wrap { display: flex; flex-direction: column; gap: 9px; flex-shrink: 0; }
.dock { display: flex; flex-direction: column; gap: 8px; }

.seg {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  padding: 3px;
  border-radius: 15px;
}
.seg-btn {
  min-height: 38px;
  border-radius: 12px;
  font-weight: 600;
  font-size: 0.9rem;
  color: var(--muted);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: background 0.18s, color 0.18s, box-shadow 0.18s;
}
.seg-btn[aria-pressed="true"] {
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow-sm);
}
.seg-n {
  font-family: var(--f-display);
  font-variant-numeric: tabular-nums;
  font-size: 0.76rem;
  background: var(--accent-tint);
  color: var(--accent);
  padding: 1px 8px;
  border-radius: 99px;
}
.seg-ph { visibility: hidden; }

.toolrow {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 84px;
  padding: 10px 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 22px;
  box-shadow: var(--shadow);
}

.mring { width: 62px; height: 62px; position: relative; flex-shrink: 0; }
.mring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.mring .track { stroke: var(--surface-2); }
.mring .val { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 0.28s ease; }
.mring.full .val { stroke: var(--muscle); }
.mring-t {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  text-align: center;
  line-height: 1.05;
}
.mring-t b { font-family: var(--f-display); font-size: 1.18rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.mring-t span { font-size: 0.65rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.clockbox { min-width: 96px; text-align: center; line-height: 1.15; flex-shrink: 0; }
.clockbox b { display: block; font-family: var(--f-display); font-size: 1.72rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.clockbox span { font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.act {
  flex: 1;
  min-width: 0;
  min-height: 52px;
  padding-inline: 14px;
  border-radius: 16px;
  background: var(--accent);
  color: var(--accent-ink);
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 1.04rem;
  box-shadow: 0 4px 16px var(--accent-glow);
  transition: transform 0.1s, background 0.16s;
}
.act:hover { background: var(--accent-hover); }
.act:active { transform: scale(0.97); }
.act.stop { background: var(--muscle); color: var(--on-muscle); box-shadow: 0 4px 16px rgba(224, 70, 43, 0.30); }

.round {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--surface-2);
  display: grid;
  place-items: center;
  flex-shrink: 0;
  font-family: var(--f-display);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  transition: background 0.15s, transform 0.1s;
}
.round:hover { background: var(--surface-3); }
.round:active { transform: scale(0.93); }
.round svg { width: 20px; height: 20px; }

.auto-btn {
  height: 46px;
  padding-inline: 12px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--muted);
  white-space: nowrap;
  flex-shrink: 0;
  transition: background 0.16s, border-color 0.16s, color 0.16s;
}
.auto-btn:hover { background: var(--surface-3); color: var(--ink); }
.auto-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
.auto-btn.on { background: var(--accent-tint); border-color: var(--accent); color: var(--accent); }
@media (max-width: 460px) {
  .auto-btn span { display: none; }
  .auto-btn { width: 46px; padding: 0; justify-content: center; }
}

/* Bottom Navigation Row */
.navrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.navbtn {
  height: 46px;
  min-width: 46px;
  padding-inline: 15px;
  border-radius: 15px;
  border: 1px solid var(--line);
  background: var(--surface);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-weight: 600;
  font-size: 0.92rem;
  box-shadow: var(--shadow-sm);
  transition: background 0.15s, transform 0.1s;
}
.navbtn:hover { background: var(--surface-2); }
.navbtn:active { transform: scale(0.96); }
.navbtn svg { width: 19px; height: 19px; flex-shrink: 0; }
.navbtn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.navbtn.primary:hover { background: var(--accent-hover); }

.mid { display: flex; align-items: center; gap: 8px; }
.chip-btn {
  height: 44px;
  padding-inline: 14px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  font-size: 0.84rem;
  color: var(--muted);
  font-weight: 500;
  white-space: nowrap;
  box-shadow: var(--shadow-sm);
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.chip-btn:hover { background: var(--surface-2); color: var(--ink); }
.chip-btn.slow { background: var(--accent-tint); border-color: var(--accent); color: var(--accent); font-weight: 600; }
@media (max-width: 420px) { .navbtn span { display: none; } .navbtn { padding: 0; } }

/* ==========================================================================
   DETAIL SIDE PANEL (>=960px) / MOBILE BOTTOM SHEET & EXERCISE LIBRARY
   ========================================================================== */
.scrim {
  position: fixed;
  inset: 0;
  background: var(--scrim);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
  z-index: 20;
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
}
.scrim.show { opacity: 1; pointer-events: auto; }

.sheet {
  position: fixed;
  inset-inline: 0;
  bottom: 0;
  z-index: 30;
  max-height: 86%;
  overflow: auto;
  overscroll-behavior: contain;
  background: var(--surface);
  border-radius: 26px 26px 0 0;
  box-shadow: var(--shadow-lg);
  padding-block: 8px calc(20px + env(safe-area-inset-bottom, 0px));
  padding-inline: max(20px, env(safe-area-inset-left, 0px)) max(20px, env(safe-area-inset-right, 0px));
  transform: translateY(105%);
  visibility: hidden;

    for (let i = 0; i <= heightSegs; i++) {

        y = Math.sin(a) * rProx * 0.46;
      } else if (t > 0.90) {
        const a = ((t - 0.90) / 0.10) * (Math.PI / 2);
        r = Math.max(0.002, Math.cos(a) * rDist);
        y = length + Math.sin(a) * rDist * 0.46;
      } else {
        const s = (t - 0.10) / 0.80;
        const baseR = lerp(rProx, rDist, s);

  /**
   * 3D Two-Bone Inverse Kinematics solver.
   */
  function solveIK3D(A, B, L1, L2, poleVec) {
    const dir = new THREE.Vector3().subVectors(B, A);
    const d = dir.length();
    if (d < 1e-5) return A.clone().addScaledVector(poleVec.clone().normalize(), L1);
    dir.divideScalar(d);
    const clampedD = clamp(d, Math.abs(L1 - L2) + 0.004, L1 + L2 - 0.002);
    const a = (L1 * L1 - L2 * L2 + clampedD * clampedD) / (2 * clampedD);
    const h = Math.sqrt(Math.max(0, L1 * L1 - a * a));

    const n = poleVec.clone().addScaledVector(dir, -poleVec.dot(dir));
    if (n.lengthSq() < 1e-6) {
      n.set(0, 1, 0).addScaledVector(dir, -dir.y);
      if (n.lengthSq() < 1e-6) n.set(0, 0, 1);
    }
    n.normalize();
    return A.clone().addScaledVector(dir, a).addScaledVector(n, h);
  }

  /**
   * Exact 3D IK constrained to a fixed target Z plane (used in Exercise 6
   * for crisp zero-clip, zero-gap knee contact against the compressed ball).
   */
  function solveIKFixedZ(A, B, L1, L2, targetZ) {
    const dz1 = targetZ - A.z;
    const dz2 = targetZ - B.z;
    const l1 = Math.sqrt(Math.max(0.01, L1 * L1 - dz1 * dz1));
    const l2 = Math.sqrt(Math.max(0.01, L2 * L2 - dz2 * dz2));
    const dx = B.x - A.x;
    const dy = B.y - A.y;
    const d = Math.max(0.01, Math.hypot(dx, dy));
    const clampedD = clamp(d, Math.abs(l1 - l2) + 0.004, l1 + l2 - 0.002);
    const ux = dx / d, uy = dy / d;
    const a = (l1 * l1 - l2 * l2 + clampedD * clampedD) / (2 * clampedD);
    const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    let nx = -uy, ny = ux;
    if (ny < 0) { nx = -nx; ny = -ny; }
    return new THREE.Vector3(A.x + ux * a + nx * h, A.y + uy * a + ny * h, targetZ);
  }

    TMP_Y.divideScalar(d);

      if (TMP_Z.lengthSq() < 1e-6) {

        if (TMP_Z.lengthSq() < 1e-6) TMP_Z.set(0, 0, 1);
